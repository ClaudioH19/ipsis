# Banco sintético de ENTRENAMIENTO (README § 4, etapa 3). Lo escribe Claude; origen: claude-opus-5.5, 2026-10-18.
#
# Dominios distintos de los de prueba (banco_sintetico.yaml), de banco_pasajes y de los documentos reales.
# Cada documento reproduce lo que mostró la oclusión (OBS-0010):
#   - unidades hermanas con tablas cuyas filas no nombran su unidad (la unidad está solo en el encabezado);
#   - artículos del mismo tema que describen el instrumento SIN el dato pedido (competidores de «otro aspecto»);
#   - anclas de entidad (comisión, beca, plan, línea) repartidas en los competidores.
# Sin anexos que repitan cifras: un negativo que contenga la respuesta con otro formato sería un falso negativo.
# Todas las preguntas tienen par formal (…f) e informal (…i, con brecha léxica, sin tildes, abreviaturas).

