# Banco sintético del laboratorio (README § 5.2). Lo escribe Claude; origen: claude-opus-5.5, 2026-10-17.
#
# Reproduce los fallos de orden observados en documentos reales:
#   hermana       la respuesta está en una unidad que solo se distingue de sus hermanas por un actor, un período o
#                 una columna (filas de tabla que no dicen a qué unidad pertenecen, como P1/P2);
#   otro_aspecto  otros pasajes del mismo tema responden otro aspecto (piden un plazo, el vecino da un monto);
#   brecha_lexica la pregunta usa palabras que el pasaje no tiene.
# Cada objetivo tiene una pregunta formal (id …f) y otra informal (id …i). `respuesta` es un literal que se busca
# dentro de `seccion` (el encabezado más cercano), no en todo el documento: las tablas hermanas repiten cifras.
#
# Particiones por documento: `dev` (descubrimiento y piloto) o `test` (congelada; nadie la mira antes de la etapa 4).
# El piloto es `dev` entero. `datos.py sintetico` lo materializa en .cache/ con el formato de banco_pasajes.

