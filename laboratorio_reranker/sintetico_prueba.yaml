- archivo: reglamento_transporte_institucional.md
  dominio: transporte
  particion: test
  texto: |
    # Reglamento del Servicio de Transporte Institucional

    ## Artículo 1. Objeto

    La universidad ofrece buses de acercamiento gratuitos entre la ciudad y el campus para estudiantes y
    funcionarios con credencial vigente. El servicio funciona solo en días hábiles del calendario académico.

    ## Artículo 2. Coordinación de Transporte

    La Coordinación de Transporte define los recorridos, publica los horarios al inicio de cada semestre, administra
    las reservas y recibe los reclamos sobre el servicio. Puede modificar un recorrido por obras o emergencias,
    informándolo con un día de anticipación.

    ## Artículo 3. Ruta 1

    La Ruta 1 une el terminal de buses con el campus por la avenida principal.

    | Dato | Detalle |
    |---|---|
    | Primera salida | 6:45 desde el terminal de buses |
    | Frecuencia | cada 20 minutos en hora punta |
    | Capacidad | 45 pasajeros sentados |

    ## Artículo 4. Ruta 2

    La Ruta 2 recorre los barrios del sector norte antes de llegar al campus.

    | Dato | Detalle |
    |---|---|
    | Primera salida | 7:10 desde la plaza norte |
    | Frecuencia | cada 40 minutos durante todo el día |
    | Capacidad | 30 pasajeros sentados |

    ## Artículo 5. Ruta 3

    La Ruta 3 es un servicio vespertino que conecta el campus con la estación de tren.

    | Dato | Detalle |
    |---|---|
    | Primera salida | 17:30 desde el campus |
    | Frecuencia | cada 30 minutos hasta las 22:00 |
    | Capacidad | 45 pasajeros sentados |

    ## Artículo 6. Reservas

    Los asientos de la Ruta 2 se reservan en la aplicación hasta las 20:00 del día anterior. Las Rutas 1 y 3 no
    requieren reserva y se ocupan por orden de llegada.

    ## Artículo 7. Normas y sanciones

    Está prohibido comer dentro de los buses y viajar de pie en la carretera. Quien reserve un asiento y no lo use
    tres veces en un mes queda sin derecho a reservar durante el mes siguiente. Los objetos olvidados se guardan en
    la Coordinación de Transporte durante 30 días.

- archivo: reglamento_evaluacion_asignaturas.md
  dominio: docencia
  particion: test
  texto: |
    # Reglamento de Evaluación de Asignaturas de Pregrado

    ## Título I. Normas comunes

    Artículo 1. Toda asignatura informa en su programa los instrumentos de evaluación, sus fechas y sus
    ponderaciones durante la primera semana de clases. El programa no puede modificarse después de la cuarta
    semana sin acuerdo escrito del curso.

    Artículo 2. El profesor responsable publica las notas en el sistema académico. Los estudiantes pueden revisar
    sus evaluaciones corregidas dentro de los cinco días hábiles siguientes a la publicación de cada nota.

    ## Título II. Asignaturas teóricas

    Las asignaturas teóricas se evalúan con pruebas escritas y un examen final.

    | Instrumento | Ponderación |
    |---|---|
    | Pruebas parciales | 60 % |
    | Controles de lectura | 10 % |
    | Examen final | 30 % |

    ## Título III. Asignaturas prácticas

    Las asignaturas prácticas se evalúan principalmente con informes y trabajo de laboratorio.

    | Instrumento | Ponderación |
    |---|---|
    | Informes de laboratorio | 50 % |
    | Prueba práctica | 30 % |
    | Examen final | 20 % |

    ## Título IV. Talleres de proyecto

    Los talleres de proyecto no tienen examen final; se evalúan por entregas del proyecto.

    | Instrumento | Ponderación |
    |---|---|
    | Entregas parciales | 40 % |
    | Presentación final | 35 % |
    | Coevaluación del equipo | 25 % |

    ## Título V. Examen final y aprobación

    Artículo 10. Para rendir el examen final se requiere una asistencia mínima del 75 % a las clases.

    Artículo 11. Se exime del examen final el estudiante que tenga un promedio de presentación igual o superior a
    5,5, sin notas bajo 4,0.

    Artículo 12. La asignatura se aprueba con nota final igual o superior a 4,0. El estudiante reprobado con nota
    entre 3,5 y 3,9 tiene derecho a un examen de repetición.

    ## Título VI. Inasistencia a evaluaciones

    Artículo 15. La inasistencia a una evaluación debe justificarse en la secretaría de la escuela dentro de las
    72 horas siguientes. Con justificación aceptada, la evaluación se recupera en la semana de recuperaciones; sin
    ella, se califica con nota 1,0.

- archivo: programa_salud_estudiantil.md
  dominio: salud-estudiantil
  particion: test
  texto: |
    # Programa de Salud Estudiantil

    ## Sección 1. Beneficiarios

    El programa atiende a los estudiantes de pregrado y postgrado con matrícula vigente. La atención se solicita en
    la aplicación del servicio de salud o en el mesón del centro de salud del campus.

    ## Sección 2. Equipo del centro de salud

    El centro de salud cuenta con médicos generales, odontólogos, psicólogos y una enfermera coordinadora. La
    enfermera coordinadora organiza las agendas, deriva los casos urgentes y gestiona las licencias médicas
    emitidas en el centro.

    ## Sección 3. Atención médica

    | Condición | Detalle |
    |---|---|
    | Copago | sin costo |
    | Horario | lunes a viernes de 8:30 a 17:30 |
    | Atenciones al año | sin límite |

    ## Sección 4. Atención dental

    | Condición | Detalle |
    |---|---|
    | Copago | $3.000 por sesión |
    | Horario | lunes a jueves de 9:00 a 16:00 |
    | Atenciones al año | hasta seis sesiones |

    ## Sección 5. Atención psicológica

    | Condición | Detalle |
    |---|---|
    | Copago | sin costo |
    | Horario | lunes a viernes de 9:00 a 19:00 |
    | Atenciones al año | hasta ocho sesiones, ampliables por indicación profesional |

    ## Sección 6. Inasistencias y cancelaciones

    Las horas se cancelan en la aplicación con al menos 12 horas de anticipación. Dos inasistencias sin cancelar en
    un semestre suspenden la posibilidad de reservar horas durante 30 días, salvo en atención psicológica de
    urgencia.

    ## Sección 7. Urgencias

    El centro de salud no atiende urgencias graves. Ante una urgencia, el estudiante debe acudir al servicio de
    urgencia más cercano; el seguro escolar cubre la atención si el accidente ocurrió en actividades académicas.

- archivo: reglamento_ayudantias.md
  dominio: docencia-apoyo
  particion: test
  texto: |
    # Reglamento de Ayudantías

    ## Artículo 1. Definición

    La ayudantía es una actividad remunerada en la que un estudiante apoya la docencia o la investigación bajo la
    supervisión de un académico. Existen tres tipos de ayudantía, con requisitos, horas y pagos distintos.

    ## Artículo 2. Académico supervisor

    El académico supervisor define las tareas del ayudante, firma el registro mensual de horas y evalúa su
    desempeño al término del semestre. Un académico puede supervisar a un máximo de cuatro ayudantes por semestre.

    ## Artículo 3. Ayudantía de cátedra

    | Elemento | Condición |
    |---|---|
    | Requisito | haber aprobado la asignatura con nota 5,5 o superior |
    | Dedicación | 6 horas semanales |
    | Pago | $90.000 mensuales |

    ## Artículo 4. Ayudantía de laboratorio

    | Elemento | Condición |
    |---|---|
    | Requisito | haber aprobado la asignatura y el curso de seguridad de laboratorios |
    | Dedicación | 8 horas semanales |
    | Pago | $120.000 mensuales |

    ## Artículo 5. Ayudantía de investigación

    | Elemento | Condición |
    |---|---|
    | Requisito | tener aprobado el 70 % de los créditos de la carrera |
    | Dedicación | 10 horas semanales |
    | Pago | $150.000 mensuales |

    ## Artículo 6. Incompatibilidades

    Un estudiante puede tener como máximo dos ayudantías en el mismo semestre, siempre que no superen 16 horas
    semanales en total. No puede ser ayudante de una asignatura que esté cursando.

    ## Artículo 7. Pago y término

    El pago se realiza el día 10 del mes siguiente, una vez recibido el registro de horas firmado. La ayudantía
    termina anticipadamente si el ayudante deja de ser alumno regular o si el académico informa un incumplimiento
    reiterado de las tareas.

