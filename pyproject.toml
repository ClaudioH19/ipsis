[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-extractivo"
version = "0.7.0"
description = "Asistente RAG extractivo, local y auditable para documentos propios."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "PyYAML>=6,<7",
  "qdrant-client>=1.12,<2",
  "snowballstemmer>=2.2,<4",
  "sentence-transformers>=3,<7",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
browser = ["pytest>=8,<10", "playwright>=1.55,<2"]

[project.scripts]
rag = "rag.cli:main"

[tool.setuptools.packages.find]
include = ["rag*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"rag.recursos" = ["plantillas/*.yaml", "idiomas/*.yaml", "despliegue/*"]
"rag.servicio" = ["estaticos/*.js", "estaticos/*.html"]

[tool.pytest.ini_options]
# El directorio temporal se elige en tests/conftest.py::pytest_configure.
addopts = "--import-mode=importlib"
pythonpath = ["tests"]
testpaths = ["tests"]
markers = [
  "slow: prueba de integración de más de 5 s (procesos reales, índices o servidores)",
  "modelos(id_hf, ...): necesita esos modelos ONNX en la caché local (rag modelos descargar)",
  "browser: prueba end-to-end que requiere Playwright y Chromium",
]
