[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-extractivo"
version = "0.7.0"
description = "Asistente RAG extractivo, local y auditable para documentos propios."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "PyYAML>=6,<7",
  "qdrant-client>=1.12,<2",
  "sentence-transformers>=3,<7",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
rag = "rag.cli:main"

[tool.setuptools.packages.find]
include = ["rag*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"rag.recursos" = ["plantillas/*.yaml", "plantillas/dominios/*/*.yaml"]
"rag.servicio" = ["estaticos/*.js", "estaticos/*.html"]
