[build-system]
requires = ["setuptools>=77"]  # license como expresión SPDX (PEP 639)
build-backend = "setuptools.build_meta"

[project]
name = "ipsis"
version = "0.9.0"
description = "Answers in the exact words of your documents: an extractive, self-hosted, CPU-only assistant that never invents."
requires-python = ">=3.11"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "prompt_toolkit>=3.0.43,<4",
  "rich>=13.9,<15",
  "onnxruntime>=1.18,<2",
  "huggingface-hub>=0.24,<2",
  "pydantic>=2.8,<3",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "PyYAML>=6,<7",
  "qdrant-client>=1.12,<2",
  "snowballstemmer>=2.2,<4",
  "tokenizers>=0.19,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
# Las pruebas de OCR simulado necesitan imágenes y renderizado PDF; no Tesseract.
test = ["pytest>=8,<10", "Pillow>=10,<13", "pypdfium2>=4.30,<6"]
browser = ["pytest>=8,<10", "playwright>=1.55,<2"]
# Solo desarrollo: convertir un modelo a ONNX (ipsis models export).
# optimum 2.x movió el exportador ONNX a optimum-onnx; este fija transformers < 4.58.
export = ["optimum-onnx[onnxruntime]>=0.1,<0.2", "torch>=2.2"]
# OCR de PDF escaneados (ipsis/ingesta/ocr.py); además requiere el programa Tesseract.
ocr = ["pytesseract>=0.3.13,<0.4", "pypdfium2>=4.30,<6"]

[project.scripts]
ipsis = "ipsis.cli:main"

[tool.setuptools.packages.find]
include = ["ipsis*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"ipsis.recursos" = ["plantillas/*.yaml", "idiomas/*.yaml", "mensajes/*.yaml", "perfiles/*.yaml", "tonos/*/*.yaml", "avatares/*",
                  "despliegue/preparar/*", "sinonimos/*.tsv", "sinonimos/*.json", "sinonimos/*.md", "sinonimos/licencias/*", "sinonimos/diccionarios/*"]
"ipsis.servicio" = ["estaticos/*.js", "estaticos/*.html", "estaticos/*.LICENSE.txt", "estaticos/*.sha256", "estaticos/admin/*"]

[tool.pytest.ini_options]
# El directorio temporal se elige en tests/conftest.py::pytest_configure.
addopts = "--import-mode=importlib"
pythonpath = ["tests"]
testpaths = ["tests"]
markers = [
  "slow: prueba de integración de más de 5 s (procesos reales, índices o servidores)",
  "modelos(id_hf, ...): necesita esos modelos ONNX en la caché local (ipsis models download)",
  "browser: prueba end-to-end que requiere Playwright y Chromium",
]
