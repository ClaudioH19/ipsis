# Banco de conversaciones (fuente). Cada conversación corre en una sesión
# propia, turno a turno, sobre el corpus del banco de consultas del mismo
# idioma (../../banco_consultas/es/corpus). Por turno:
#
# - hereda: true si el turno debe heredar el tema de la conversación («¿y en
#   el extranjero?»), false si trae un tema nuevo y no debe heredar nada.
#   Sin la clave, no se mide (el turno puede hacer cualquiera de las dos).
# - respuesta: texto literal que la respuesta directa debe mostrar.
# - directa: false si el turno no tiene respuesta en los documentos (una
#   trampa o una pregunta fuera de dominio): no debe ser una respuesta directa.
#
# Las que necesitan recordar más de un turno atrás o volver a un tema
# anterior lo dicen en su comentario: miden la memoria de toda la conversación.

- id: es-conv-001  # seguimiento y luego cambio de tema sin marcador
  turnos:
  - pregunta: ¿Qué pasa si el proveedor rechaza la orden?
    respuesta: el Supervisor de Compras anula la orden
  - pregunta: ¿y cuántos días tiene para aceptarla?
    hereda: true
    respuesta: dos días hábiles para aceptar la Orden de Compra
  - pregunta: ¿Qué horario tiene la Mesa de Ayuda?
    hereda: false
    respuesta: de lunes a viernes de 8:00 a 18:00 horas

- id: es-conv-002  # cuatro turnos sobre el mismo tema
  turnos:
  - pregunta: ¿Quién puede pedir teletrabajo?
    respuesta: al menos seis meses de antigüedad en la institución
  - pregunta: ¿y cuántos días a la semana?
    hereda: true
    respuesta: hasta tres días por semana
  - pregunta: ¿y qué equipos me pasan?
    hereda: true
    respuesta: La institución entrega un notebook y un monitor
  - pregunta: ¿y la asignación?
    hereda: true
    respuesta: asignación mensual de 20.000 pesos

- id: es-conv-003
  turnos:
  - pregunta: ¿Cuál es el viático diario dentro del país?
    respuesta: 45.000 pesos dentro del país
  - pregunta: ¿y en el extranjero?
    hereda: true
    respuesta: 150 dólares en el extranjero
  - pregunta: ¿con cuánta anticipación lo pido?
    hereda: true
    respuesta: al menos siete días antes del viaje
  - pregunta: ¿y si no rindo a tiempo?
    hereda: true
    respuesta: el monto se descuenta de la remuneración siguiente

- id: es-conv-004  # seguimiento y luego cambio de tema completo
  turnos:
  - pregunta: ¿Cómo cambio mi contraseña?
    respuesta: Ingrese al portal de autoservicio
  - pregunta: ¿cada cuánto vence?
    hereda: true
    respuesta: La contraseña vence cada 90 días
  - pregunta: ¿y cuántos caracteres debe tener?
    hereda: true
    respuesta: al menos 12 caracteres
  - pregunta: ¿Quién compra los pasajes aéreos?
    hereda: false
    respuesta: Los pasajes aéreos los compra la Unidad de Viajes

- id: es-conv-005  # cambio de tema y vuelta con un seguimiento del tema nuevo
  turnos:
  - pregunta: ¿Cuánto dura la garantía de la cafetera Brío C2?
    respuesta: 24 meses desde la fecha de compra
  - pregunta: ¿y qué no cubre?
    hereda: true
    respuesta: no cubre daños por caídas
  - pregunta: ¿Qué horario tiene la biblioteca?
    hereda: false
    respuesta: de lunes a viernes de 8:30 a 20:00
  - pregunta: ¿y los sábados?
    hereda: true
    respuesta: Los sábados abre de 10:00 a 14:00

- id: es-conv-006  # cambio de tema deliberado aunque empiece con «y»
  turnos:
  - pregunta: ¿Cuánto tarda en llegar un computador nuevo?
    respuesta: entrega el equipo dentro de diez días hábiles
  - pregunta: ¿y cuánto es el viático en el extranjero?
    hereda: false
    respuesta: 150 dólares en el extranjero

- id: es-conv-007  # una pregunta fuera de dominio en medio; luego vuelve (memoria de más de un turno)
  turnos:
  - pregunta: ¿Quién firma la Resolución de compra?
    respuesta: Director de Administración para su firma
  - pregunta: ¿Cuál es la capital de Mongolia?
    hereda: false
    directa: false
  - pregunta: ¿y quién la redacta?
    hereda: true
    respuesta: El Operador de Compras redacta la Resolución de compra

- id: es-conv-008
  turnos:
  - pregunta: ¿Qué pasa si no cumplo mis metas teletrabajando?
    respuesta: puede suspender el teletrabajo
  - pregunta: ¿con cuánta anticipación me avisan?
    hereda: true
    respuesta: con diez días de anticipación
  - pregunta: ¿y cada cuánto se revisa el acuerdo?
    hereda: true
    respuesta: se revisa cada seis meses

- id: es-conv-009  # trampa dentro de un seguimiento
  turnos:
  - pregunta: ¿Cuántos días tiene el proveedor para aceptar la Orden de Compra?
    respuesta: dos días hábiles para aceptar la Orden de Compra
  - pregunta: ¿y para entregar los productos?
    hereda: true
    directa: false

- id: es-conv-010
  turnos:
  - pregunta: cuando empieza la compra?
    respuesta: Una vez aprobado el Formulario de Requerimiento
  - pregunta: ¿y quién registra el requerimiento?
    hereda: true
    respuesta: El Operador de Compras registra el requerimiento en el sistema
  - pregunta: ¿y en cuántos días se emite la orden?
    hereda: true
    respuesta: plazo de diez días hábiles desde la aprobación del Formulario de Requerimiento

- id: es-conv-011
  turnos:
  - pregunta: ¿Cuántas veces al día funciona el riego?
    respuesta: dos veces al día
  - pregunta: ¿y en verano?
    hereda: true
    respuesta: se agrega un tercer riego
  - pregunta: ¿cuándo se apaga la bomba?
    hereda: true
    respuesta: cuando el estanque baja del 20 %

- id: es-conv-012  # trampa dentro de un seguimiento de varios turnos
  turnos:
  - pregunta: ¿A qué temperatura se guardan las muestras de sangre?
    respuesta: a 4 °C
  - pregunta: ¿por cuánto tiempo?
    hereda: true
    respuesta: por un máximo de 72 horas
  - pregunta: ¿y las de orina?
    hereda: true
    directa: false

- id: es-conv-013
  turnos:
  - pregunta: ¿Hasta cuándo puedo pedir el reembolso?
    respuesta: hasta 30 días después de recibir el pedido
  - pregunta: ¿y en cuántos días lo pagan?
    hereda: true
    respuesta: dentro de 10 días hábiles
  - pregunta: ¿y si el producto llega dañado?
    hereda: true
    respuesta: el envío de la devolución es gratuito

- id: es-conv-014  # tres temas seguidos, ninguno hereda
  turnos:
  - pregunta: ¿Cuánto dura el préstamo de libros?
    respuesta: dura 14 días
  - pregunta: ¿Quién compra los pasajes aéreos?
    hereda: false
    respuesta: Los pasajes aéreos los compra la Unidad de Viajes
  - pregunta: ¿Cada cuánto vence la contraseña?
    hereda: false
    respuesta: La contraseña vence cada 90 días

- id: es-conv-015  # vuelve a un tema de dos turnos atrás (memoria de la conversación)
  turnos:
  - pregunta: ¿Cuál es el viático diario dentro del país?
    respuesta: 45.000 pesos dentro del país
  - pregunta: ¿Qué horario tiene la Mesa de Ayuda?
    hereda: false
    respuesta: de lunes a viernes de 8:00 a 18:00 horas
  - pregunta: volviendo al viático, ¿y en el extranjero?
    hereda: true
    respuesta: 150 dólares en el extranjero

- id: es-conv-016
  turnos:
  - pregunta: me bloquearon la cuenta, qué hago?
    respuesta: llame a la Mesa de Ayuda al anexo 4500
  - pregunta: ¿y fuera de horario?
    hereda: true
    respuesta: las urgencias se reportan al anexo 4501

- id: es-conv-017  # seguimiento muy corto tras una respuesta con cifra
  turnos:
  - pregunta: ¿Desde qué monto se necesita una Resolución?
    respuesta: Las compras superiores a 100 UTM requieren una Resolución
  - pregunta: ¿y quién la firma?
    hereda: true
    respuesta: Director de Administración para su firma

- id: es-conv-018  # premisa falsa dentro de un seguimiento
  turnos:
  - pregunta: ¿Qué asignación mensual se da para gastos de conexión?
    respuesta: asignación mensual de 20.000 pesos
  - pregunta: ¿y la de 35.000 pesos qué cubre?
    hereda: true
    directa: false

- id: es-conv-019
  turnos:
  - pregunta: ¿Quién es la responsable del registro de muestras?
    respuesta: la técnica Marta Rojas
  - pregunta: ¿y cuándo se rechaza una muestra?
    hereda: true
    respuesta: si el tubo llega sin etiqueta
  - pregunta: ¿Qué cubre la garantía de la cafetera?
    hereda: false
    respuesta: Cubre defectos del motor, de la bomba y del calentador

- id: es-conv-020  # el tema nuevo comparte una palabra con el anterior («días»)
  turnos:
  - pregunta: ¿En cuántos días responde la jefatura la solicitud de teletrabajo?
    respuesta: La jefatura responde dentro de cinco días hábiles
  - pregunta: ¿En cuántos días entrega la Mesa de Ayuda un equipo nuevo?
    hereda: false
    respuesta: entrega el equipo dentro de diez días hábiles
