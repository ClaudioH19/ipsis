# Informal validation bank (source). Same rules as the universal bank
# (see ../README.md): the category comes from the id and construir.py computes
# evidence and offsets. Corpus: a copy of the query bank.
#
# Questions as a hurried user types them: lowercase, no question marks, typos
# («hows», «pasword»), abbreviations («wfh», «PO»), slang («stuff», «gotta»)
# and words the document does not use. None was used to design the rules:
# they are measured only to validate.

