# Banco de alternativas (ADR 0008). Corpus: el catálogo y el inventario de
# ./corpus más los documentos de ../../banco_consultas/es/corpus, con el
# config/domain.yaml de ./dominio.yaml.
#
# tipo:
# - exacta: la respuesta está en el corpus; no debe ofrecer alternativas
#   ajenas (si las ofrece, solo cuentan como correctas las de «aceptables»).
# - vecino: lo pedido no está, pero hay algo parecido; «aceptables» son
#   textos literales de los pasajes que valen como alternativa (basta uno).
# - sin_vecino: lo pedido no está y nada se le parece: toda alternativa es
#   errónea.
# - fuera_dominio: nada que ver con el corpus: toda alternativa es errónea y
#   nunca debe haber alguna (meta dura).
# particion: dev calibra pesos y umbral; test solo informa.

