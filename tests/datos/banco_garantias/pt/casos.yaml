# Banco de garantias (fonte). Mesmas regras do banco universal: a categoria sai do id e
# construir.py calcula evidências e offsets. Seis documentos novos com cerca de 12 fatos
# cada; os nove do banco de consultas ficam como distratores. Serve para estreitar a cota
# de risco das respostas diretas: não é usado para desenhar regras nem escolher limiares.

