# Banco de garantías (fuente). Mismas reglas que el banco universal: la categoría sale
# del id y construir.py calcula evidencias y offsets. Seis documentos nuevos con unos
# 12 hechos cada uno; los nueve del banco de consultas quedan como distractores.
# Sirve para estrechar la cota de riesgo de las respuestas directas: no se usa para
# diseñar reglas ni elegir umbrales.

