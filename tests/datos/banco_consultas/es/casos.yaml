# Banco de consultas naturales (fuente). Mismas reglas que el banco universal
# (ver ../README.md): la categoría sale del id y construir.py calcula
# evidencias y offsets. El manual de adquisiciones es el caso que motivó la
# capa de comprensión de consultas: «¿cuándo empieza la compra?» tiene
# respuesta («Una vez aprobado el Formulario de Requerimiento…»), pero no
# comparte palabras con la pregunta salvo «compra», que aparece en muchos
# pasos posteriores. Los demás documentos son los del banco universal, como
# distractores.

# --- la consulta que reveló el problema y sus variantes ---------------------
