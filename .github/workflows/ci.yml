name: ci

on:
  push:
    branches: [main, "v2/**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rapidas:
    name: rápidas (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Instalar (sin torch)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -c "import importlib.util, sys; sys.exit(importlib.util.find_spec('torch') is not None)"
      - name: Linter de tonos (1.890 plantillas y neutralidad)
        run: python -m pytest tests/lenguaje/test_tonos.py -q
      - name: Pruebas rápidas
        run: python -m pytest -m "not slow and not browser" -q

  modelos:
    name: modelos reales (integración)
    runs-on: ubuntu-latest
    needs: rapidas
    env:
      RAG_MODELOS_DIR: ${{ github.workspace }}/.cache/modelos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/cache@v4
        with:
          path: ${{ env.RAG_MODELOS_DIR }}
          key: modelos-${{ hashFiles('rag/recursos/perfiles/*.yaml', 'rag/modelos/catalogo.py') }}
      - name: Instalar
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Descargar y verificar los modelos del perfil light
        run: |
          rag modelos descargar --perfil light
          mkdir -p /tmp/proyecto-light && cd /tmp/proyecto-light
          rag init --perfil light
          rag modelos verificar
      - name: Pruebas lentas
        run: python -m pytest -m slow -q

  web:
    name: avatar, widget y panel (Node + Chromium)
    runs-on: ubuntu-latest
    needs: rapidas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: herramientas/avatar/package-lock.json
      - name: Build reproducible de avatar.js (compara el sha256)
        working-directory: herramientas/avatar
        run: |
          npm ci
          npm run verificar
          (cd ../../rag/servicio/estaticos && sha256sum --check avatar.js.sha256)
      - name: Validar los avatares con la librería
        working-directory: herramientas/avatar
        run: node validar.mjs
      - name: Instalar
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[browser]"
          python -m playwright install --with-deps chromium
      - name: Pruebas de navegador (widget, avatar y panel)
        run: python -m pytest -m browser -q
      - name: Ejemplo React
        run: |
          npm install --prefix ejemplos/react
          npm run build --prefix ejemplos/react
      - name: Ejemplo WordPress
        run: php -l ejemplos/wordpress/rag-extractivo-widget.php

  paquete:
    name: wheel en entorno limpio
    runs-on: ubuntu-latest
    needs: rapidas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Construir wheel
        run: |
          python -m pip install build twine
          python -m build --wheel
          python -m twine check dist/*.whl
      # Instala solo el wheel (sin el checkout en el path) en una carpeta vacía:
      # comprueba que perfiles, tonos, avatares y estáticos viajan en el paquete.
      - name: Instalar y probar en una carpeta vacía
        run: |
          python -m venv /tmp/venv
          mkdir /tmp/artefacto /tmp/vacio
          cp dist/*.whl /tmp/artefacto/
          cd /tmp/vacio
          /tmp/venv/bin/python -m pip install /tmp/artefacto/*.whl
          /tmp/venv/bin/rag init --perfil light
          test -f configuracion/motor.yaml
          test -f configuracion/personalidad.yaml
          /tmp/venv/bin/rag personalidad tono listar
          /tmp/venv/bin/rag personalidad avatar listar | grep -q folio
          /tmp/venv/bin/rag widget exportar /tmp/widget --api https://rag.example
          test -f /tmp/widget/widget.js
          test -f /tmp/widget/avatar.js
          test -f /tmp/widget/avatar.js.LICENSE.txt
          test -f /tmp/widget/avatares/folio.avatar.json
          /tmp/venv/bin/python - <<'EOF'
          from importlib.resources import files
          r, s = files("rag.recursos"), files("rag.servicio")
          for ruta in ("perfiles/light.yaml", "tonos/es/cordial.yaml", "tonos/pt/_reglas.yaml",
                       "avatares/folio.avatar.json", "despliegue/preparar/docker-compose.yml"):
              assert (r / ruta).is_file(), ruta
          for ruta in ("estaticos/widget.js", "estaticos/avatar.js", "estaticos/avatar.js.LICENSE.txt",
                       "estaticos/admin/panel.js"):
              assert (s / ruta).is_file(), ruta
          EOF
          /tmp/venv/bin/rag desplegar preparar --dominio asistente.example.com
          test -f dist/docker-compose.yml
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-python-3.12
          path: dist/*.whl
          if-no-files-found: error

  imagen:
    name: imagen Docker light
    runs-on: ubuntu-latest
    needs: rapidas
    steps:
      - uses: actions/checkout@v4
      - name: Construir la imagen del perfil light
        run: docker build --build-arg PERFIL=light --tag rag-extractivo:light .
      - name: Usuario no root y CLI
        run: |
          test "$(docker run --rm --entrypoint id rag-extractivo:light -u)" = "10001"
          docker run --rm rag-extractivo:light rag --help
      - name: Sin red, /health, /widget.js y /avatar.js responden
        run: |
          docker run -d --name rag-smoke --network none rag-extractivo:light
          for intento in $(seq 1 30); do
            if docker exec rag-smoke python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"; then
              break
            fi
            sleep 2
          done
          docker exec rag-smoke python - <<'EOF'
          import json, urllib.error, urllib.request
          base = "http://127.0.0.1:8000"
          assert json.load(urllib.request.urlopen(base + "/health"))["estado"] == "vivo"
          for ruta in ("/widget.js", "/avatar.js", "/config"):
              assert urllib.request.urlopen(base + ruta).status == 200, ruta
          try:
              urllib.request.urlopen(base + "/ready")
              raise AssertionError("la imagen sin índice no debe estar lista")
          except urllib.error.HTTPError as e:
              cuerpo = json.load(e)
              assert e.code == 503 and cuerpo["listo"] is False, cuerpo
          EOF
      - name: Registro del contenedor
        if: always()
        run: |
          docker logs rag-smoke || true
          docker rm --force rag-smoke || true
