name: Evaluación documental manual
on:
  workflow_dispatch:
    inputs:
      comparar_referencia:
        description: Comparar respuestas directas contra la referencia histórica (no mide ranking v2)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  documentos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IPSIS_MODELS_DIR: ${{ github.workspace }}/.cache/modelos
      IPSIS_ONNX_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.26'
          enable-cache: true
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: .cache/modelos
          key: onnx-linux-${{ hashFiles('ipsis/modelos/catalogo.py', 'ipsis/recursos/perfiles/*.yaml') }}
      - run: uv sync --locked --extra test
      - name: Validar contratos y referencias congeladas
        run: uv run --locked --extra test pytest tests/evaluacion/test_banco_general.py tests/modelos/test_contratos_embeddings.py tests/modelos/test_catalogo_descarga.py tests/configuracion/test_perfiles.py -q
      - name: Medir los dos perfiles y las tres calidades
        env:
          COMPARAR_REFERENCIA: ${{ inputs.comparar_referencia }}
        run: |
          opciones=(--download)
          if [[ "$COMPARAR_REFERENCIA" != "true" ]]; then opciones+=(--no-baseline); fi
          uv run --locked --extra test python herramientas/evaluacion/general.py "${opciones[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regresion-documental
          path: .cache/regresion-general/
