name: pruebas

on:
  push:
    branches: [main, "v2/**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rapidas:
    name: rápidas (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # torch desde el índice CPU: sin esto, en Linux pip descarga la
      # variante CUDA (~2 GB), que el proyecto no usa.
      - name: Instalar
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[test]"
      - name: Pruebas rápidas
        run: python -m pytest -m "not slow and not browser" -q

  navegador:
    name: widget en Chromium
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[browser]"
          python -m playwright install --with-deps chromium
      - name: Pruebas del widget
        run: python -m pytest -m browser -q
      - name: Compilar ejemplo React
        run: |
          npm install --prefix ejemplos/react
          npm run build --prefix ejemplos/react
      - name: Validar plugin WordPress
        run: php -l ejemplos/wordpress/rag-extractivo-widget.php

  integracion:
    name: integración (modelo y Qdrant local)
    runs-on: ubuntu-latest
    needs: rapidas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-multilingual-e5-small
      - name: Instalar
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[test]"
      - name: Pruebas lentas
        run: python -m pytest -m slow -q

  paquete:
    name: wheel en entorno limpio
    runs-on: ubuntu-latest
    needs: rapidas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Construir wheel
        run: |
          python -m pip install build twine
          python -m build --wheel
          python -m twine check dist/*.whl
      # Instala solo el wheel (sin el checkout en el path) y ejecuta
      # `rag init` en una carpeta vacía: comprueba que plantillas y
      # estáticos viajan dentro del paquete.
      - name: Instalar y probar rag init
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          mkdir /tmp/artefacto
          cp dist/*.whl /tmp/artefacto/
          mkdir /tmp/vacio && cd /tmp/vacio
          /tmp/venv/bin/python -m pip install /tmp/artefacto/*.whl
          /tmp/venv/bin/rag init
          test -f configuracion/motor.yaml
          test -f configuracion/dominios/_generico/perfil.yaml
          /tmp/venv/bin/rag widget exportar /tmp/widget --api https://rag.example
          test -f /tmp/widget/widget.js
          test -f /tmp/widget/snippet.html
          /tmp/venv/bin/python -c "from importlib.resources import files; assert (files('rag.servicio') / 'estaticos/widget.js').is_file(); assert (files('rag.recursos') / 'plantillas/motor.yaml').is_file()"
          /tmp/venv/bin/python -c "import rag; print(rag.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-python-3.12
          path: dist/*.whl
          if-no-files-found: error

  imagen:
    name: imagen Docker ejecutable
    runs-on: ubuntu-latest
    needs: rapidas
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen desde el wheel
        run: docker build --tag rag-extractivo:ci .
      - name: Verificar usuario, CLI y recursos empaquetados
        run: |
          test "$(docker run --rm --entrypoint id rag-extractivo:ci -u)" = "10001"
          docker run --rm rag-extractivo:ci rag --help
          docker run --rm --entrypoint python rag-extractivo:ci -c "from importlib.resources import files; assert (files('rag.servicio') / 'estaticos/widget.js').is_file(); assert (files('rag.recursos') / 'plantillas/motor.yaml').is_file()"
      - name: Probar servidor y diagnóstico sin Qdrant
        run: |
          docker run -d --name rag-extractivo-smoke \
            -e HF_HUB_OFFLINE=1 \
            -e TRANSFORMERS_OFFLINE=1 \
            -p 127.0.0.1:18000:8000 \
            rag-extractivo:ci
          for intento in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18000/health > /tmp/health.json; then
              break
            fi
            sleep 2
          done
          grep -q '"estado":"vivo"' /tmp/health.json
          codigo=$(curl --silent --output /tmp/ready.json --write-out '%{http_code}' http://127.0.0.1:18000/ready)
          test "$codigo" = "503"
          grep -q 'no listo' /tmp/ready.json
      - name: Diagnóstico del contenedor
        if: always()
        run: |
          docker logs rag-extractivo-smoke || true
          docker rm --force rag-extractivo-smoke || true
