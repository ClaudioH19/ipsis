name: pruebas

on:
  push:
    branches: [main, "v2/**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rapidas:
    name: rápidas (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # torch desde el índice CPU: sin esto, en Linux pip descarga la
      # variante CUDA (~2 GB), que el proyecto no usa.
      - name: Instalar
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[test]"
      - name: Pruebas rápidas
        run: python -m pytest -m "not slow" -q

  integracion:
    name: integración (modelo y Qdrant local)
    runs-on: ubuntu-latest
    needs: rapidas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-multilingual-e5-small
      - name: Instalar
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[test]"
      - name: Pruebas lentas
        run: python -m pytest -m slow -q

  paquete:
    name: wheel en entorno limpio
    runs-on: ubuntu-latest
    needs: rapidas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Construir wheel
        run: |
          python -m pip install build
          python -m build --wheel
      # Instala solo el wheel (sin el checkout en el path) y ejecuta
      # `rag init` en una carpeta vacía: comprueba que plantillas y
      # estáticos viajan dentro del paquete.
      - name: Instalar y probar rag init
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          /tmp/venv/bin/python -m pip install dist/*.whl
          mkdir /tmp/vacio && cd /tmp/vacio
          /tmp/venv/bin/rag init
          test -f configuracion/motor.yaml
          test -f configuracion/dominios/_generico/perfil.yaml
          /tmp/venv/bin/python -c "import rag; print(rag.__version__)"
