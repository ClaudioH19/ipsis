name: ✨ Mejora
description: Propón una función o un cambio.
labels: ["mejora"]
body:
  - type: textarea
    id: problema
    attributes:
      label: ¿Qué problema resuelve?
    validations:
      required: true
  - type: textarea
    id: propuesta
    attributes:
      label: Propuesta
    validations:
      required: true
  - type: checkboxes
    id: principios
    attributes:
      label: Principios del proyecto
      description: Ver CONTRIBUTING.md.
      options:
        - label: No agrega texto generado por un modelo a las respuestas.
          required: true
        - label: No requiere entrenar ni hacer fine-tuning de modelos.
          required: true
  - type: textarea
    id: alternativas
    attributes:
      label: Alternativas consideradas
