[pytest]
# El directorio temporal global de esta máquina (C:\Users\...\AppData\Local\Temp\pytest-of-*)
# devuelve "Acceso denegado" al listarlo (restricción del entorno, no del
# proyecto), lo que rompe la fixture `tmp_path` de pytest. Se usa un
# directorio local en su lugar -- ya está fuera de git (`.cache/`
# en .gitignore), así que no arriesga versionar nada.
addopts = --basetemp=.cache/pytest_tmp
markers =
    slow: prueba de integración que carga modelos o levanta procesos reales
