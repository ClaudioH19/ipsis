# Assistant personality: tone of the answers and widget avatar.
# Presentation only: it never changes what the assistant answers, and it needs
# no reindexing or recalibration. Edit it here, with `ipsis personality …` or
# in the /admin/panel.
#
# tone.active: cordial | formal | serious | upbeat | friendly | empathetic | direct
# tone.variety: rotating (no repeats in consecutive turns) | fixed (always the first)
# tone.templates: your own texts per situation, e.g.
#   no_answer: ["That is not in the team handbook."]
# avatar.placement: message (beside the assistant's message, bottom right) | header | top-corner | bottom-corner
# avatar.colors: {body: "#rrggbb", eyes: "#rrggbb"} (does not modify the avatar file)
# avatar.events: event → animation or expression (`ipsis personality avatar events`)
# With Folio, empty events uses the built-in defaults: float while closed,
# wake-up on each opening, attentive while waiting, listening while typing,
# nod on send, thinking/thinking-long during search, bounce on a found answer,
# unsure for related answers, sorry for no answer, worried on error, goodbye
# on close, and sleepy after inactivity. Assignments here override those defaults.
config_version: 1
tone:
  active: cordial
  variety: rotating
  templates: {}
avatar:
  enabled: true
  definition: folio
  placement: message
  size: 56
  in_launcher: true
  gaze:
    enabled: true
    eye_range: 6
    head_range: 8
    dead_zone: 24
  idle_minutes: 2
  colors: {}
  events: {}
