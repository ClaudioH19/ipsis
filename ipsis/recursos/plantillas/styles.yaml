# Widget theme. `ipsis init` copies it into each project; edit it here, with
# `ipsis widget style set section.key=value` or in the /admin/panel.
preset: "classic"
# Search layouts for pipeline v2: search | search_compact.
# V2 shows visible source excerpts with an expandable full context in every theme.
presentation:
  density: "comfortable"       # comfortable | compact
  citations: "accordion"       # accordion | list (citations are always shown)
  show_status_label: true
  text_align: "justify"        # justify | start (document passages, hyphenated by language)
  result_layout: "cards"       # cards | lines | editorial
  show_result_numbers: true
  show_section_path: true
  expand_context: false
  show_suggestions: true
# Empty text uses the assistant's language. Titles are plain text.
content:
  title: ""                   # overrides assistant_name in the widget header
  subtitle: ""
  welcome_title: ""
  welcome_text: ""
# Where and how the widget appears on your site. Attributes on the <script> or
# <ipsis-chat> tag (position, size, launcher…) take precedence.
placement:
  position: "bottom-right"     # bottom-right | bottom-left | top-right | top-left | embedded
  offset_x: 24                 # px from the side edge
  offset_y: 24                 # px from the top or bottom edge
  z_index: 2147483000
  size: "normal"               # compact | normal | wide
  launcher: "bubble"           # bubble | tab | hidden (open it with window.Ipsis.open())
colors:
  accent: "#2563eb"
  accent_text: "#ffffff"
  surface: "#ffffff"
  background: "#f4f5f7"
  text: "#15181d"
  muted_text: "#5b6472"
  border: "#e3e6ea"
  warning: "#b4801f"
  warning_border: "#d9a441"
  live: "#22c55e"
  heading: "var(--rw-texto)"
  section: "var(--rw-texto-suave)"
  result_surface: "var(--rw-superficie)"
  result_border: "var(--rw-borde)"

dark_colors:
  accent: "#93c5fd"
  accent_text: "#172554"
  surface: "#1b1f27"
  background: "#12151b"
  text: "#eceff4"
  muted_text: "#9aa4b2"
  border: "#2b323d"
  warning: "#e0b055"
  heading: "var(--rw-texto)"
  section: "var(--rw-texto-suave)"
  result_surface: "var(--rw-superficie)"
  result_border: "var(--rw-borde)"

typography:
  family: "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
  base_size: "14px"
  message_size: "13.5px"
  citation_size: "12px"
  label_size: "10.5px"
  line_height: "1.55"
  heading_family: "var(--rw-fuente)"
  heading_size: "17px"
  heading_weight: "650"
  section_size: "12px"

shape:
  panel_radius: "18px"
  bubble_radius: "16px"
  control_radius: "12px"
  panel_width: "390px"
  panel_height: "600px"
  button_size: "58px"
  icon_size: "26px"
  gap: "12px"
  padding: "16px"
  result_radius: "12px"
  result_gap: "16px"
  result_padding: "14px"

shadows:
  panel: "0 12px 40px rgba(16,24,40,.18), 0 2px 8px rgba(16,24,40,.08)"
  button: "0 8px 24px rgba(16,24,40,.28)"
  panel_dark: "0 12px 40px rgba(0,0,0,.55), 0 2px 8px rgba(0,0,0,.35)"
  button_dark: "0 8px 24px rgba(0,0,0,.5)"

animations:
  enabled: true
  panel_duration: ".34s"
  bubble_duration: ".36s"
  control_duration: ".22s"
  pulse_duration: "1.2s"
  easing: "cubic-bezier(.16,1,.3,1)"
  enter_offset: "16px"
  enter_scale: ".92"
  hover_scale: "1.04"

custom_css: ""
