# Assistant identity. Created by `ipsis init`; edit it here or with
# `ipsis configure key=value`.
config_version: 5
assistant_name: "Document assistant"
domain_description: "the loaded documents"
language: en
profile: medium
cors_origins: []
widget_keys: []
# Query log in .ipsis/logs/queries.jsonl: question, status, rule, signals and
# evidence with offsets (no session or IP). Off by default for privacy.
# Turn it on with `ipsis configure query_log.enabled=true` and review it with
# `ipsis audit`.
query_log:
  enabled: false
# What the assistant does when the answer is not in the documents
# (docs/decisions/0008-proactive-posture-and-metadata-similarity.md):
# proactive offers up to max_alternatives similar passages that are in the
# documents, quoted and cited; strict only says it is not there.
# `ipsis configure posture.mode=strict`
posture:
  mode: proactive
  max_alternatives: 3
