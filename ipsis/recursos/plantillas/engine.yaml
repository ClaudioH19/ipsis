# Engine settings. Most projects never edit this file: the installation
# profile (assistant.yaml::profile) sets the CPU models.
config_version: 7
pipeline: v2
# Default source router. Set pipeline: v1 explicitly for the legacy engine.
# These settings apply only to v2; it does not use v1 calibration or focus rules.
v2:
  results_limit: 3              # ranked source dropdowns per page
  retrieve_n: 60               # candidate pool; "Keep searching" reuses its ranking
  rerank_candidates: 60
  query_budget_ms: 2500         # total work budget; running inference cannot be interrupted
  reranker_batch_size: 2
  reranker_max_tokens: 256
  qa_highlights: false
  max_result_chars: 16000
  context_neighbors: 1
retrieval:
  # model: set by the profile; uncomment to pin it.
  chunking_strategy: "CH-F256"
  with_header: false
  mode: "hybrid"                # hybrid | dense | sparse
  top_k: 3
  collection_base: "{coleccion_base}"
  qdrant_path: ".ipsis/index/qdrant"
  collection_version: 1

components:
  parser: "builtin"
  chunker: "builtin"
  dense_encoder: "onnx"
  sparse_encoder: "bm25"
  retriever: "qdrant"
  fusion: "rrf"
  reranker: null
  intent_classifier: "rules"     # v1 only
  answer_extractor: "sentence_selector"  # v1 only
  evidence_verifier: "literal_offsets"
  response_renderer: "templates"
  abstention_policy: "cascade_v1"  # v1 only

qdrant:
  mode: "local"                 # local | server
  server_url: "http://localhost:6333"

service:
  max_concurrency: 4

# V1 memory of each conversation (follow-up questions): forgotten after this
# many minutes without questions; at most max_sessions at a time.
conversation:
  expiry_minutes: 30
  max_sessions: 1024

security:
  rate_limit:
    capacity: 100
    rate_per_second: 1.0

# V1 answer rendering. V2 source publication is controlled by the v2 block.
rendering:
  max_fragment_chars: 500
  max_fragments: 2
  min_relative_score: 0.6
  inline_citation: "short"      # full | short | none
  include_opening: true

# V1 policy thresholds live in the profile (`ipsis profile show`) and, after
# calibrating, in config/calibration.yaml.
abstention:
  # If the question names an entity (e.g. "article 9") that exists in the
  # corpus but not among the candidates, up to N fragments containing it are fetched.
  max_extra_fragments: 2

pipeline_version: "ingesta-0.1.0"
