# Relações que se perguntam (ipsis.lenguaje.consultas): os padrões as reconhecem
# na pergunta e suas palavras não contam como tema; as pistas costumam estar na
# frase que responde e a sobem na seleção. Em minúsculas e sem acentos; vence a
# primeira intenção que casa.
respaldo_intencion:
  intfloat/multilingual-e5-small:
    similitud: 0.895
    margen: 0.0
    habilitadas: [procedimiento]
intenciones:
  umbral:
    ejemplos:
    - "Qual é a quantidade máxima de ingressos que posso reservar?"
    - "Qual é o mínimo de participantes para abrir a oficina?"
    - "Acima de que renda é preciso pagar esse imposto?"
    - "Abaixo de que temperatura o aparelho para?"
    - "A partir de que valor se exige uma declaração?"
    - "A partir de que idade é permitido entrar no museu?"
    - "Qual é o limite de peso da bagagem?"
    - "Que valor mínimo dá direito ao desconto?"
    - "A partir de quantas pessoas se considera um grupo?"
    - "Qual é a temperatura máxima que o forno suporta?"
    patrones:
    - (desde|a partir de) que (valor|montante|quantia|quantidade|idade|numero)
    - que (valor|montante|limite|teto)( minimo| maximo)?
    - qual e o (valor|limite|teto|minimo|maximo)
    pistas:
    - superior a
    - superiores a
    - acima de
    - mais de
    - menos de
    - inferior a
    - inferiores a
    - ate
    - no minimo
    - no maximo
    - a partir de
  inicio:
    ejemplos:
    - "Que data marca o início da campanha?"
    - "Quando minha assinatura será ativada?"
    - "Quando é liberado o acesso à piscina?"
    - "Desde que momento vale a cobertura?"
    - "Em que momento as aulas têm início?"
    - "O que precisa acontecer para que a inscrição comece?"
    - "Quando começa a temporada de pesca?"
    - "A partir de quando a norma entra em vigor?"
    - "Em que momento posso começar a usar o passe?"
    - "O que dá início ao período de matrícula?"
    patrones:
    - quando (comeca|comecam|inicia|iniciam|parte|se inicia|se comeca)
    - desde quando
    - a partir de quando
    - em que momento
    - quando se (realiza|realizam|faz|fazem|efetua|efetuam|executa)
    pistas:
    - uma vez
    - depois de
    - apos
    - a partir de
    - desde que
    - assim que
    - antes de
    - quando
  fin:
    respaldo_patrones:
    - venc\w*|expir\w*|caduc\w*|renov\w*|validade|termin\w*|finaliz\w*|ate|ultimo dia|data limite
    ejemplos:
    - "A cada quanto tempo vence o passe de visitante?"
    - "Com que frequência vence a licença para dirigir?"
    - "Quando preciso renovar a licença porque vence?"
    - "Em que data o cartão deixa de funcionar?"
    - "Quando termina a validade do passe mensal?"
    - "Em que data acaba a promoção?"
    - "Até quando a licença continua válida?"
    - "Quando o cupom deixa de ser válido?"
    - "Em que momento termina a chamada para inscrições?"
    - "Qual é o último dia para se inscrever?"
    patrones:
    - quando (termina|terminam|acaba|vence|vencem|expira|finaliza)
    - ate quando
    pistas:
    - ate
    - no maximo
    - vence
    - expira
    - termina
  consecuencia:
    ejemplos:
    - "O que ocorre comigo por não concluir a inscrição?"
    - "Qual é o resultado de rejeitar o convite?"
    - "Quais são os efeitos de não entregar a declaração?"
    - "Que medidas são tomadas quando se perde a chave?"
    - "Como a falta de um documento afeta o pedido?"
    - "O que acontece se eu chegar atrasado ao espetáculo?"
    - "O que ocorre quando o fornecimento é interrompido?"
    - "O que acontece se a encomenda chegar danificada?"
    - "Qual é o efeito de cancelar a reserva?"
    - "E se faltar a assinatura no formulário?"
    patrones:
    - o que (acontece|ocorre|faco) (se|quando)
    - e se
    - em caso de
    pistas:
    - se
    - em caso de
    - devera
  responsable:
    ejemplos:
    - "A quem cabe revisar o inventário?"
    - "Quem tem a tarefa de abrir a sala?"
    - "Que entidade se ocupa de cobrar a matrícula?"
    - "Quem controla as visitas?"
    - "Quem fica encarregado de reservar a hospedagem?"
    - "Que pessoa revisa as reservas do hotel?"
    - "Quem é responsável pela manutenção do elevador?"
    - "A que setor cabe emitir o certificado?"
    - "Quem autoriza o acesso ao laboratório?"
    - "De quem é a responsabilidade de atualizar o cadastro?"
    patrones:
    - quem( e responsavel| deve| tem que)?
    - a quem
    - que (pessoa|cargo|setor|departamento)
    pistas:
    - responsavel
    - encarregado
    - a cargo
    - cabe a
  requisito:
    ejemplos:
    - "O que é exigido para que aceitem a inscrição?"
    - "Que informações são necessárias para se candidatar?"
    - "Que características deve ter uma foto válida?"
    - "Quantas páginas no mínimo o relatório precisa ter?"
    - "Quais são as condições para receber a licença?"
    - "Que documentos devo levar para renovar a licença?"
    - "Que condições preciso cumprir para obter uma bolsa?"
    - "O que é necessário para se inscrever na oficina?"
    - "Quais são os requisitos para adotar um animal?"
    - "O que devo apresentar para comprovar minha residência?"
    patrones:
    - o que (e preciso|preciso|se exige|e necessario)
    - que (documentos|requisitos)
    pistas:
    - exige
    - requer
    - precisa
    - deve
    - devem
    - requisito
  procedimiento:
    respaldo_patrones:
    - como|o que (eu |nos )?(faco|fazemos|fazer)|que passos|de que (forma|maneira)|procedimento|processo
    ejemplos:
    - "Esqueci meu código de acesso, como faço para recuperá-lo?"
    - "Não encontro minha carteirinha, o que faço para recuperá-la?"
    - "Cancelaram minha reserva, o que faço agora?"
    - "Preciso mudar meus dados, como faço isso?"
    - "De que forma consigo uma segunda via da credencial?"
    - "Como solicito uma devolução na loja?"
    - "Que passos devo seguir para reservar uma sala?"
    - "De que maneira se cadastra um visitante?"
    - "Qual é o procedimento para mudar uma consulta?"
    - "Perdi minha carteirinha, como consigo outra?"
    patrones:
    - como (se|posso|faco|devo)
    - quais (os )?passos
    - qual e o (procedimento|processo)
    pistas:
    - primeiro
    - depois
    - em seguida
    - passo
  # «Quanto custa trocar o filtro?» pede um valor: «a cada 45 dias» fala do filtro mas
  # não responde o que se pergunta.
  costo:
    exige_pista: true
    entidades_pista: [monto]
    ejemplos:
    - "Quanto custa renovar o passaporte?"
    - "Quanto vale a entrada do museu?"
    - "Qual é o preço do curso de inglês?"
    - "Quanto cobram pelo estacionamento?"
    - "Qual é o custo da matrícula?"
    - "Quanto sai consertar a máquina de lavar?"
    patrones:
    - quanto (custa|custam|vale|valem|cobra|cobram|sai|saem)
    - qual (e )?o (preco|custo)
    - que preco tem
    pistas:
    - reais
    - pesos
    - dolares
    - euros
    - preco
    - custo
    - tarifa
    - gratis
    - gratuito
    - gratuita
  # «A cada quanto tempo a senha expira?» pede um período: a oração que responde diz
  # «a cada 90 dias», não como trocá-la.
  frecuencia:
    exige_pista: true
    ejemplos:
    - "A cada quanto tempo a carteira de motorista é renovada?"
    - "Com que frequência o filtro de ar deve ser limpo?"
    - "Quantas vezes por ano o extintor é inspecionado?"
    - "De quanto em quanto tempo é feito o backup do servidor?"
    - "Com que periodicidade as mensalidades são pagas?"
    - "A cada quanto tempo passa o caminhão de lixo?"
    patrones:
    - (a )?cada quanto( tempo)?
    - de quanto em quanto tempo
    - com que (frequencia|periodicidade)
    - quantas vezes (por|ao|na) (dia|semana|mes|ano)
    pistas:
    - a cada
    - cada
    - vezes por
    - vezes ao
    - diario
    - diaria
    - semanal
    - mensal
    - anual
  # «Quanto dura o estágio?» pede um prazo: a frase que responde o diz («4 semanas»),
  # não a que define o estágio.
  duracion:
    exige_pista: true
    entidades_pista: [plazo]
    ejemplos:
    - "Quanto dura a garantia da geladeira?"
    - "Quanto tempo dura o curso de primeiros socorros?"
    - "Qual é a duração do contrato de aluguel?"
    - "Quanto tempo demora o trâmite da licença?"
    - "Quanto tempo leva para chegar o pedido?"
    - "Por quanto tempo o certificado é válido?"
    patrones:
    - quanto (tempo )?(dura|duram)
    - qual (e )?a duracao
    - quanto tempo (demora|demoram|leva|levam)
    - por quanto tempo
    pistas:
    - minutos
    - horas
    - dias
    - semanas
    - meses
    - anos
    - semestre
    - semestres
# Como começa uma pergunta de seguimento (ipsis.consulta.seguimiento), em minúsculas e sem acentos.
seguimiento:
- e
- e se
- e com
- e para
- e quando
- e quem
- e depois
- entao
- mas
- tambem
# Sinônimos (ipsis.lenguaje.consultas): só substituem uma palavra da pergunta que não está no corpus.
sinonimos:
- [precisa, precisam, precisar, requer, requerem, requerer, exige, exigem, exigir]
- [comeca, comecam, comecar, inicia, iniciam, iniciar]
- [termina, terminam, terminar, finaliza, finalizam, finalizar]
- [paga, pagam, pagar]
- [envia, enviam, enviar, remete, remetem, remeter, manda, mandam, mandar]
- [aprova, aprovam, aprovar, autoriza, autorizam, autorizar]
- [conserta, consertam, consertar, repara, reparam, reparar]
- [custa, custam, custar, preco]
# Equivalências coloquiais de uso geral (qualquer documento de escritório): só atuam quando a
# palavra da pergunta não está no corpus e um membro do grupo está.
- [pede, pedem, pedir, peco, solicita, solicitam, solicitar]
- [geladeira, refrigerador]
- [anota, anotam, anotar, registra, registram, registrar]
- [aguenta, aguentam, aguentar, dura, duram, durar]
- [aviao, avioes, aereo, aerea, aereos, aereas, voo, voos]
- [carro, carros, automovel, automoveis, veiculo, veiculos]
- [quebrado, quebrada, quebrados, danificado, danificada, danificados]
- [gente, pessoas]
- [cabe, cabem, caber, capacidade]
- [alugar, aluga, aluguel, locar, locacao]
- [morrer, morre, falecer, falecimento]
- [fogo, incendio]
- [pc, computador]
- [significa, significam, significar, indica, indicam, indicar]
- [usar, usa, usam, utilizar, utiliza, utilizam]
# Palavras que nunca são termo foco (ipsis.consulta.etapas.filtros): verbos de apoio, unidades
# e quantificadores da pergunta («a cada quanto tempo»: a forma da pergunta, não o tema).
# Pronomes anafóricos: «Quem aprova isso?» sem antecedente pede esclarecimento.
pronombres_anaforicos: [isso, isto, aquilo, ele, ela, eles, elas, lo, la, los, las]
# Abreviações de quem escreve com pressa: a pergunta é coloquial (ipsis.lenguaje.estilo).
abreviaturas_informales: [q, pq, oq, pra, pro, pras, pros, vc, vcs, tb, tbm, td, cmg, msm, qdo, qnd]
# Perguntas que pedem uma definição: só elas se respondem com a linha do glossário.
patrones_definicion: ['^o que (e|é|sao|são|significa|significam) ', '^(que|qué) (e|é|significa) ']
# «gastos de electricidad» frente a «gastos de conexión»: mismo núcleo, otro modificador.
preposiciones_modificador: [de, da, do, das, dos, para]
genericas_memoria: [tempo]
genericas: [quanto, quanta, quantos, quantas, tempo, fazer, faz, fazem, feito, realizar, realiza, realizam, ter, tem, têm, tenho, poder, pode, podem, posso, dever, deve, devem, devo, haver, há, ser, estar, dar, da, dão, ir, acontecer, acontece, vez, vezes, dia, dias, semana, semanas, mes, meses, ano, anos, hora, horas, minuto, minutos, alguém, algo, qualquer, vou, vai, vão, vamos, vem, vêm, venho, tiver, tiverem, tenha, der, derem, estou, está, estão, cumprir, cumpro, cumpre, cumprem, quero, queria, querer, gostaria, saber]
# Sufixos de substantivos derivados que o stemmer mantém: «assinatura» conta como «assina».
sufijos_derivados: [atur, ament, ment, aca, ica]
