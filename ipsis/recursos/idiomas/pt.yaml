# Paquete de idioma: portugués. Todo texto y patrón que depende del idioma
# vive aquí, no en el código. Un proyecto puede sobrescribir cualquier clave
# en config/language.yaml.
codigo: pt
nombre: Português
stemmer: portuguese
bordes_respuesta:
  unidades_cantidad: [caractere, caracteres, página, páginas]
  prefijos_cantidad: [pelo menos, no mínimo, no máximo, até, em até, em, por, a partir de]
  referencias_cantidad: [desde, depois de, a partir de, após]
  limites_actor: ['\s+e\s+(?:(?:a|o|as|os)\s+)?(?:envia|encaminha|entrega|assina|aprova|autoriza)\b', ',\s*(?:que|quem)\b']
stopwords:
