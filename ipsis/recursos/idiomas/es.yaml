# Palabras que nunca son término foco (ipsis.consulta.etapas.filtros): verbos de apoyo y
# unidades. «¿Desde cuándo se hace la compra?» habla de la compra, no de hacer.
# Pronombres anafóricos: «¿Quién lo aprueba?» sin antecedente pide aclaración.
pronombres_anaforicos: [lo, le, les, eso, esto, ello, aquello]
# «gastos de electricidad» frente a «gastos de conexión»: mismo núcleo, otro modificador.
preposiciones_modificador: [de, del, para]
genericas_memoria: [tiempo]
genericas: [tiempo, hacer, hace, hacen, hecho, realizar, realiza, realizan, tener, tiene, tienen, tengo, poder, puede, pueden, puedo, deber, debe, deben, debo, haber, hay, ser, estar, dar, da, dan, ir, pasar, pasa, vez, veces, dia, dias, semana, semanas, mes, meses, año, años, hora, horas, minuto, minutos, alguien, algo, cualquiera, voy, va, van, vamos, viene, vienen, vengo, tenga, tuviera, estoy, estan, cumplir, cumplo, cumple, cumplen, quiero, quisiera, querer, quería, gustaría, saber]
