golden_instrucciones:
  nota_respondible: 'Escribe una pregunta cuya respuesta esté EXPLÍCITA en este fragmento de «{documento}» (tema:
    {terminos}). En literal_answer copia el dato mínimo tal cual aparece.'
  nota_trampa: Escribe una pregunta sobre el MISMO tema ({terminos}) y la misma entidad que la fila {par}, pero
    que pida un dato que NO esté en ningún documento. Deja literal_answer vacía.
  conversacionales:
  - hola
  - gracias
  - ¿Qué puedes hacer?
  leeme: "GOLDEN SET: PREGUNTAS DE PRUEBA PARA EL ASISTENTE\n=================================================\n\
    \nEste archivo explica cómo completar golden.csv. Con él se mide si el\nasistente responde bien, y si se abstiene\
    \ cuando los documentos no tienen\nla respuesta. Es opcional: el asistente funciona sin golden set. No se\n\
    entrena ningún modelo: solo se miden resultados y se ajustan umbrales.\n\nCÓMO COMPLETARLO\n----------------\n\
    1. Abre golden.csv con Excel, LibreOffice o un editor de texto.\n2. En cada fila escribe una pregunta en la\
    \ columna «question», como la\n   escribiría un usuario real.\n3. No cambies las columnas «id», «type», «pair»\
    \ ni «subtype».\n4. Las filas que dejes sin pregunta se ignoran.\n5. Puedes agregar filas nuevas (deja «id»\
    \ vacío; se genera solo).\n6. Guarda como CSV UTF-8.\n\nTIPOS DE FILA\n-------------\nanswerable\n  La respuesta\
    \ EXISTE literalmente en los documentos. En\n  «literal_answer» copia el dato mínimo exactamente como aparece\n\
    \  (mismas palabras, números y tildes).\n    Pregunta:          ¿Cuánto dura la garantía?\n    Respuesta literal:\
    \ 18 meses\n\nno_answer (filas «same_topic_trap»)\n  Pregunta sobre el MISMO tema y la misma entidad que su\
    \ fila par\n  (columna «pair»), pero que pida un dato que NO está en ningún documento.\n  Deja «literal_answer»\
    \ vacía.\n    BIEN: el documento dice cuánto dura la garantía, pero no quién la\n          aprueba  ->  ¿Quién\
    \ aprueba la garantía?\n    MAL:  ¿Cuál es la capital de Japón?  (no tiene que ver con los\n          documentos:\
    \ no prueba nada útil)\n  Estas preguntas son las más importantes: comprueban que el asistente no\n  responda\
    \ con un pasaje parecido que no contiene el dato.\n\nfalse_premise (opcional, agrega filas)\n  Da por cierto\
    \ algo que no existe: «¿Qué dice el artículo 99?» si no hay\n  artículo 99.\n\nambiguous (opcional, agrega filas)\n\
    \  No se puede responder sin aclarar: «¿Cuánto dura?».\n\nconversational\n  Saludos y cortesía; ya vienen completas.\n\
    \nAYUDAS\n------\n«suggested_passage» y «key_terms» muestran de qué sección sale cada\nfila. «document» indica\
    \ el archivo; úsalo si el mismo texto aparece en\nvarios documentos.\n\nTAMAÑO\n------\nCon 30 a 60 preguntas\
    \ el golden sirve para ajustar y comparar perfiles.\nPara CERTIFICAR estadísticamente un riesgo de falsas respuestas\
    \ menor a 5%\nhacen falta al menos 59 respuestas aceptadas sin error en la parte de\nprueba (más de 120 preguntas\
    \ respondibles en total). El asistente avisa al\nimportar si el tamaño no alcanza.\n\nDespués: ipsis golden\
    \ import golden/golden.csv\n"
