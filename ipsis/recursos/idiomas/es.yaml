- [pc, compu, computador, computadora, ordenador]
- [auto, autos, carro, carros, coche, coches, vehiculo, vehiculos]
- [avion, aviones, aereo, aerea, aereos, aereas, vuelo, vuelos]
- [gente, personas]
- [cabe, caben, caber, capacidad]
- [arrendar, arrienda, arriendo, alquilar, alquila, alquiler]
- [muere, muera, morir, fallece, fallecer, fallecimiento]
