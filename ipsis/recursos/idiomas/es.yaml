conversacional:
  categorias:
  - greeting
  - thanks
  - farewell
  - capability
  patrones:
    greeting:
    - ^\s*hola\b
    - ^\s*buenos? d[ií]as\b
    - ^\s*buenas tardes\b
    - ^\s*buenas noches\b
    - ^\s*qu[eé] tal\b
    - ^\s*hey\b
    - ^\s*buenas\b
    thanks:
    - \bgracias\b
    farewell:
    - ^\s*chao\b
    - ^\s*adi[oó]s\b
    - ^\s*nos vemos\b
    - ^\s*hasta luego\b
    - ^\s*bye\b
    capability:
    - qu[eé] puedes hacer
    - qui[eé]n eres
    - para qu[eé] sirves
    - c[oó]mo funcionas
    - qu[eé] eres t[uú]
