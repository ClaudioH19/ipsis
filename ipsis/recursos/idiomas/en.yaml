golden_instrucciones:
  nota_respondible: 'Write a question whose answer is EXPLICITLY in this excerpt of «{documento}» (topic: {terminos}).
    In literal_answer copy the minimal answer exactly as written.'
  nota_trampa: Write a question about the SAME topic ({terminos}) and the same entity as row {par}, but asking for
    information that is NOT in any document. Leave literal_answer empty.
  conversacionales:
  - hello
  - thanks
  - What can you do?
  leeme: "GOLDEN SET: TEST QUESTIONS FOR THE ASSISTANT\n============================================\n\nThis file\
    \ explains how to fill in golden.csv. It measures whether the\nassistant answers correctly, and whether it abstains\
    \ when the documents do\nnot contain the answer. It is optional: the assistant works without a\ngolden set.\
    \ No model is trained: results are only measured and thresholds\nadjusted.\n\nHOW TO FILL IT IN\n-----------------\n\
    1. Open golden.csv with Excel, LibreOffice or a text editor.\n2. In each row write a question in the «question»\
    \ column, the way a real\n   user would.\n3. Do not change the «id», «type», «pair» or «subtype» columns.\n\
    4. Rows left without a question are ignored.\n5. You can add new rows (leave «id» empty; it is generated).\n\
    6. Save as CSV UTF-8.\n\nROW TYPES\n---------\nanswerable\n  The answer EXISTS literally in the documents. In\
    \ «literal_answer»\n  copy the minimal answer exactly as written.\n    Question:       How long is the warranty?\n\
    \    Literal answer: 18 months\n\nno_answer («same_topic_trap» rows)\n  A question about the SAME topic and\
    \ entity as its paired row («pair»\n  column) that asks for information NOT present in any document. Leave\n\
    \  «literal_answer» empty.\n    GOOD: the document says how long the warranty lasts, but not who\n         \
    \ approves it  ->  Who approves the warranty?\n    BAD:  What is the capital of Japan?  (unrelated to the documents:\
    \ it\n          tests nothing useful)\n  These are the most important rows: they check that the assistant does\n\
    \  not answer with a similar passage that lacks the information.\n\nfalse_premise (optional, add rows)\n  Assumes\
    \ something that does not exist: «What does article 99 say?» when\n  there is no article 99.\n\nambiguous (optional,\
    \ add rows)\n  Cannot be answered without clarification: «How long does it last?».\n\nconversational\n  Greetings\
    \ and courtesy; already filled in.\n\nHELPERS\n-------\n«suggested_passage» and «key_terms» show which section\
    \ each row\ncomes from. «document» names the file; use it if the same text appears in\nseveral documents.\n\n\
    SIZE\n----\n30 to 60 questions are enough to tune and compare profiles. To CERTIFY\nstatistically a false-answer\
    \ risk below 5%, at least 59 accepted answers\nwithout error are needed in the test split (over 120 answerable\
    \ questions\nin total). The assistant warns on import if the size is not enough.\n\nNext: ipsis golden import\
    \ golden/golden.csv\n"
