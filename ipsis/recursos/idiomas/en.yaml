# Paquete de idioma: inglés. Todo texto y patrón que depende del idioma
# vive aquí, no en el código. Un proyecto puede sobrescribir cualquier clave
# en config/language.yaml.
codigo: en
nombre: English
stemmer: english
bordes_respuesta:
  unidades_cantidad: [character, characters, page, pages]
  prefijos_cantidad: [at least, at most, up to, within, in, for, a maximum of, a minimum of]
  referencias_cantidad: [from, after, following]
  limites_actor: ['\s+and\s+(?:(?:it|they|he|she|then)\s+)?(?:sends?|forwards?|submits?|signs?|approves?|authorises?)\b', ',\s*(?:who|which)\b']
