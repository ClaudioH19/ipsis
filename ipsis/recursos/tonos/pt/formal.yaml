  - Pode verificá-lo na citação apresentada a seguir.
  - O texto original consta abaixo para sua verificação.
  - Consulte a referência abaixo para comprovar sua origem.
  - A fonte exata é indicada a seguir.
  - Convido a verificar na citação abaixo.
  - A seguir mostra-se o texto de origem.
  - Pode contrastar a resposta com a citação abaixo.
