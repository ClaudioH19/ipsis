  - 'Sua consulta não tem resposta direta nos documentos. Isto é o relacionado:'
  - 'Não consta uma resposta direta. A seguir, o conteúdo relacionado:'
  - 'Não foi possível achar uma resposta direta; apresento o mais pertinente:'
