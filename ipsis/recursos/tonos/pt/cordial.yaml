# Tom cordial (padrão): gentil e claro. A primeira variante de cada situação
# é o texto anterior aos tons.
tone: cordial
description: Gentil e claro; o tom padrão.
situations:
  greeting:
  - Olá! Sou {assistant_name}. Respondo perguntas sobre {domain_description} citando o texto exato do documento. O que você precisa saber?
  - 'Olá! Pergunte o que precisar sobre {domain_description}: busco a resposta no documento e mostro de onde a tirei.'
  - Olá! Aqui é {assistant_name}. Conte o que você procura em {domain_description} e eu mostro o que diz o texto.
  - Olá, sou {assistant_name}. O que você gostaria de consultar sobre {domain_description}?
  - Que bom te ver! Pergunte o que quiser sobre {domain_description} e eu mostro a citação exata.
  thanks:
  - De nada. Se tiver outra pergunta sobre {domain_description}, estou aqui.
  - Com prazer. Qualquer outra dúvida sobre {domain_description}, é só dizer.
  - Foi um prazer! Se quiser revisar mais alguma coisa de {domain_description}, pergunte.
  - Não há de quê. Continuo aqui para o que precisar sobre {domain_description}.
  - Que bom que ajudou. Mais alguma coisa sobre {domain_description}?
  farewell:
  - Até logo.
  - Até mais. Volte quando precisar consultar o documento.
  - Tudo de bom! Estarei aqui quando precisar revisar os documentos.
  - Até breve. Quando quiser, continuamos a consulta.
  - Adeus, e obrigado por perguntar.
  capability:
  - Sou {assistant_name}. Respondo perguntas sobre {domain_description} citando o texto exato do documento. Se a informação não estiver lá, eu digo em vez de inventar uma resposta.
  - Busco em {domain_description} e devolvo texto literal com a fonte.
  - 'Sou {assistant_name}: encontro em {domain_description} o trecho que responde sua pergunta e mostro como está, com a citação.'
  - Respondo só com o que diz {domain_description}, citado ao pé da letra. Se algo não estiver lá, eu digo.
  - 'Pergunte sobre {domain_description}: mostro o texto exato e onde aparece, sem inventar nada.'
  opening:
  - 'Isto é o que diz o documento:'
  - 'Encontrei isto no documento:'
  - 'O documento coloca assim:'
  - 'Segundo o texto carregado:'
  - 'Aqui está o que encontrei:'
  addition:
  - 'Soma-se a isto o seguinte:'
  - 'O documento acrescenta, em outra seção:'
  - 'Também diz isto:'
  - 'E complementa assim:'
  - 'Além disso, encontrei isto:'
  condition:
  - 'Isto se aplica sob uma condição:'
  - 'Há uma condição associada:'
  - 'O documento condiciona assim:'
  - 'Leve em conta esta condição:'
  - 'Para que se aplique, o documento indica:'
  exception:
  - 'Com uma exceção:'
  - 'Há uma ressalva:'
  - 'O documento prevê uma exceção:'
  - 'Atenção a esta exceção:'
  - 'Não se aplica no seguinte caso:'
  related_intro:
  - 'Não encontrei uma resposta direta. Isto é o que os documentos dizem sobre o tema:'
  - 'Não há uma resposta direta nos documentos, mas isto é o mais relacionado:'
  - 'Não encontrei exatamente o que você procura. Isto é o mais próximo nos documentos:'
  - 'Não vejo uma resposta direta; mostro o que os documentos dizem sobre o tema:'
  - 'O que você pergunta não aparece de forma direta. Isto é o relacionado que encontrei:'
  missing_focus:
  - 'Não encontrei informação específica sobre «{term}». Isto é o mais próximo:'
  - 'Os documentos não falam especificamente de «{term}». Isto é o mais parecido:'
  - 'Não há nada pontual sobre «{term}», mas isto está relacionado:'
  - 'Não encontrei «{term}» nos documentos. Mostro o mais próximo:'
  - 'Sobre «{term}» não há uma resposta direta. Isto é o relacionado:'
  no_answer:
  - Não encontrei essa informação nos documentos disponíveis.
  - Essa informação não aparece nos documentos disponíveis.
  - Procurei nos documentos e não encontrei nada sobre isso.
  - 'Não tenho essa informação: ela não está nos documentos carregados.'
  - Desculpe, isso não consta nos documentos disponíveis.
  premise_not_found:
  - Não encontrei informação sobre "{entity}" nos documentos disponíveis. Talvez não exista ou esteja fora do que seus documentos cobrem.
  - Os documentos não mencionam "{entity}". Talvez esteja fora do que eles cobrem.
  - Não encontrei "{entity}" nos documentos disponíveis.
  - Não há informação sobre "{entity}" nos seus documentos; talvez não faça parte deles.
  - Procurei "{entity}" e não aparece nos documentos disponíveis.
  welcome:
  - Olá, como posso ajudar?
  - Olá! Pergunte o que precisar sobre os documentos.
  - Olá, sou {assistant_name}. O que você quer consultar?
  - O que você gostaria de saber? Respondo citando o documento.
  - Olá! Escreva sua pergunta e eu busco a resposta no texto.
  waiting:
  - Consulta do documento em curso
  - Revisão dos documentos em curso
  - Busca da citação exata
  - Um momento, leitura em curso
  - Procura da resposta no texto
  citations_hint:
  - Você pode conferir na citação abaixo.
  - O texto original está abaixo para você verificar.
  - Veja a citação abaixo para saber de onde vem.
  - A fonte exata está logo abaixo.
  - Confira você mesmo na citação abaixo.
  network_error:
  - Não foi possível contatar o assistente. Verifique sua conexão e tente de novo.
  - Parece que não há conexão com o assistente. Tente novamente em um momento.
  - Não consegui me conectar. Verifique sua conexão e tente de novo.
  - A conexão com o assistente caiu. Tente novamente.
  - Não consegui falar com o serviço. Tente outra vez em alguns segundos.
  rate_limit_error:
  - Muitas perguntas seguidas. Espere alguns segundos e tente de novo.
  - Estamos indo um pouco rápido. Espere alguns segundos antes da próxima pergunta.
  - Recebi muitas perguntas juntas. Me dê alguns segundos e tente de novo.
  - Preciso de uma pausa breve. Tente de novo em alguns segundos.
  - Espere um momento antes de perguntar outra vez.
  service_error:
  - O assistente não está disponível agora. Tente de novo mais tarde.
  - O serviço está se preparando. Tente novamente em um momento.
  - Agora não consigo responder. Tente outra vez daqui a pouco.
  - O assistente está ocupado. Tente de novo em alguns segundos.
  - Houve um problema no serviço. Tente novamente mais tarde.
