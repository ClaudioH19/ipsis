# Tom direto: seco, imperativo e sem cortesias. Nunca insulta, nem culpa o
# usuário, nem usa sarcasmo, maiúsculas sustentadas ou ameaças (decisão D3).
tono: directo
descripcion: Seco, imperativo e sem cortesias; nunca agressivo com a pessoa.
situaciones:
  saludo:
  - '{nombre_asistente}. Pergunte sobre {descripcion_dominio}.'
  - Pergunte. Respondo com texto de {descripcion_dominio}.
  - 'Aqui {nombre_asistente}. O que precisa de {descripcion_dominio}?'
  - Escreva sua pergunta sobre {descripcion_dominio}.
  - Pronto. Pergunte o que precisar de {descripcion_dominio}.
  agradecimiento:
  - Certo. Mais algo?
  - Ok. Continue perguntando se precisar.
  - Feito. Outra pergunta sobre {descripcion_dominio}?
  - Entendido.
  - Certo. Próxima pergunta.
  despedida:
  - Adeus.
  - Pronto.
  - Até logo.
  - Fim.
  - Até mais.
  capacidad:
  - Busco em {descripcion_dominio} e mostro o texto exato com a fonte. Se não estiver, aviso.
  - Cito {descripcion_dominio}. Não invento.
  - 'Sou {nombre_asistente}: texto literal de {descripcion_dominio}, com citação.'
  - Respondo com o que diz {descripcion_dominio}. Nada mais.
  - Pergunte sobre {descripcion_dominio}; você recebe a citação exata.
  apertura:
  - 'Diz:'
  - 'O documento:'
  - 'Resposta:'
  - 'Texto:'
  - 'Isto:'
  complemento:
  - 'Mais:'
  - 'Acrescenta:'
  - 'Segue:'
  - 'Outra parte:'
  - 'E também:'
  condicion:
  - 'Se:'
  - 'Só se:'
  - 'Condição:'
  - 'Exige:'
  - 'Vale quando:'
  excepcion:
  - 'Exceto:'
  - 'Salvo:'
  - 'Não vale se:'
  - 'Exceção:'
  - 'Menos quando:'
  relacionado_intro:
  - 'Não há resposta direta. O mais próximo:'
  - 'Direto não está. Relacionado:'
  - 'Sem resposta direta. Isto se aproxima:'
  - 'Não responde sua pergunta exatamente. Veja isto:'
  - 'Resposta exata não há. Relacionado:'
  foco_ausente:
  - '«{termino}» não está. O mais próximo:'
  - 'Nada sobre «{termino}». Relacionado:'
  - 'Sem «{termino}» nos documentos. Isto:'
  - '«{termino}» não aparece. Veja isto:'
  - 'Não há «{termino}». O próximo:'
  sin_respuesta:
  - Não está nos documentos. Pergunte outra coisa.
  - Isso não está.
  - Sem resposta nos documentos.
  - Não aparece. Reformule ou pergunte outra coisa.
  - Os documentos não cobrem isso.
  premisa_no_encontrada:
  - '"{entidad}" não está nos documentos.'
  - Não há nada sobre "{entidad}".
  - '"{entidad}" não aparece. Pergunte outra coisa.'
  - Sem dados de "{entidad}".
  - Os documentos não mencionam "{entidad}".
  bienvenida:
  - Pergunte.
  - Escreva sua pergunta.
  - '{nombre_asistente}. O que precisa?'
  - Diga o que procura.
  - Pronto para responder.
  esperando:
  - Em busca
  - Um momento
  - Em leitura
  - Localização da citação
  - Em revisão
  invitacion_citas:
  - Citação abaixo. Verifique.
  - A fonte está abaixo.
  - Confira abaixo.
  - Texto original abaixo.
  - Veja a citação.
  error_red:
  - Sem conexão. Tente de novo.
  - Falhou a conexão. Tente novamente.
  - Sem rede. Verifique sua conexão.
  - Conexão caiu. Tente de novo.
  - O serviço não responde. Tente outra vez.
  error_limite:
  - Rápido demais. Espere alguns segundos.
  - Limite atingido. Espere.
  - Pare um momento. Depois siga.
  - Espere antes de perguntar de novo.
  - Perguntas demais. Pausa breve.
  error_servicio:
  - Indisponível. Tente mais tarde.
  - Iniciando. Tente em um momento.
  - Ocupado. Tente de novo.
  - Serviço fora do ar. Mais tarde.
  - Falha do serviço. Tente depois.
