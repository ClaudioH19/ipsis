# Serious tone: sober, neutral, short sentences.
tone: serious
description: Sober and neutral, with short sentences.
situations:
  greeting:
  - I am {assistant_name}. I answer about {domain_description} with quotes from the document.
  - Assistant for {domain_description}. Type your question.
  - Hello. Ask about {domain_description}; every answer cites its source.
  - I am {assistant_name}. What do you need to know about {domain_description}?
  - Available for questions about {domain_description}.
  thanks:
  - You are welcome.
  - Understood. You can keep asking about {domain_description}.
  - Fine. I remain available.
  - Noted. Another question about {domain_description}?
  - Thank you.
  farewell:
  - Goodbye.
  - Until later.
  - End of session.
  - I remain available.
  - Good day.
  capability:
  - I search {domain_description} and show the literal text with its source.
  - I am {assistant_name}. I do not write answers; I quote {domain_description}.
  - I answer only with text from {domain_description}. If it is missing, I say so.
  - 'Function: locate the passage in {domain_description} that answers and quote it.'
  - I consult {domain_description} and deliver the exact quote.
  opening:
  - 'The document says:'
  - 'Document text:'
  - 'Per the document:'
  - 'Relevant passage:'
  - 'Source:'
  addition:
  - 'Also:'
  - 'In addition:'
  - 'Another section states:'
  - 'It adds:'
  - 'Further:'
  condition:
  - 'Condition:'
  - 'Applies if:'
  - 'With this condition:'
  - 'Requirement:'
  - 'Under this condition:'
  exception:
  - 'Exception:'
  - 'Except:'
  - 'With this proviso:'
  - 'Does not apply here:'
  - 'Excluded case:'
  related_intro:
  - 'No direct answer. Related text:'
  - 'No direct answer. Closest content:'
  - 'A direct answer is not recorded. Related content:'
  - 'Direct answer not found. Related:'
  - 'Not a direct answer. The related text is this:'
  missing_focus:
  - 'No information on «{term}». Closest content:'
  - 'No data on «{term}». Related:'
  - '«{term}» does not appear. Nearby content:'
  - 'Nothing specific on «{term}». Related content:'
  - '«{term}» is not recorded. Closest text:'
  no_answer:
  - That information is not in the documents.
  - No information in the documents.
  - Not recorded in the documents.
  - The documents do not cover that.
  - No answer in the documents.
  premise_not_found:
  - '"{entity}" does not appear in the documents.'
  - No information on "{entity}".
  - '"{entity}" is not recorded in the documents.'
  - The documents do not mention "{entity}".
  - No data on "{entity}".
  welcome:
  - Type your question.
  - Questions about the document.
  - I am {assistant_name}. Ask.
  - Answers with document quotes.
  - Ready to search.
  waiting:
  - Searching
  - Consulting the document
  - Reviewing
  - Locating the quote
  - Processing
  citations_hint:
  - Quote below.
  - Verify in the quote.
  - Source below.
  - Original text below.
  - Check the reference.
  network_error:
  - No connection to the assistant. Retry.
  - Connection error. Try again.
  - The service did not respond. Check your connection.
  - Connection interrupted. Retry.
  - Service unreachable. Try later.
  rate_limit_error:
  - Question limit reached. Wait a few seconds.
  - Too many questions. Wait.
  - A short pause is required.
  - Wait before asking again.
  - Temporary limit. Retry in seconds.
  service_error:
  - Service unavailable. Try later.
  - Service starting. Retry.
  - Not available for now.
  - Service busy. Retry.
  - Service failure. Try later.
