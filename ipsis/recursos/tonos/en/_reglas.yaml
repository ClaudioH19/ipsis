# Expressions no tone may use (including «direct»): insults, blaming the
# user or condescension.
forbidden:
- idiot
- stupid
- dumb
- moron
- useless
- ridiculous
- shut up
- your fault
- obviously
- as i already told you
# Regional idioms: the bundled tones must be neutral (a test enforces it).
# In a project's own overrides they are a warning from 'ipsis personality validate'
# and 'ipsis doctor', not an error.
regionalisms:
- fire away
- no worries
- sure thing
- catch you
- swamped
- stuff
- breather
- give it another go
- alright
- whoops
- uh oh
- cheers
- mate
- y'all
- gonna
- wanna
