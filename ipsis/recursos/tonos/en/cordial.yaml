# Cordial tone (default): kind and clear. The first variant of each situation
# is the text used before tones existed.
tone: cordial
description: Kind and clear; the default tone.
situations:
  greeting:
  - Hi! I'm {assistant_name}. I answer questions about {domain_description} quoting the exact text of the document. What do you need to know?
  - 'Hi! Ask me anything about {domain_description}: I look for the answer in the document and show you where I found it.'
  - Hello! {assistant_name} here. Tell me what you are looking for in {domain_description} and I will show you what the text says.
  - Hi, I'm {assistant_name}. What would you like to check in {domain_description}?
  - Nice to see you! Ask me anything about {domain_description} and I will show you the exact quote.
  thanks:
  - You're welcome. If you have another question about {domain_description}, I'm here.
  - Glad to help. Any other question about {domain_description}, just ask.
  - My pleasure! If you want to check anything else in {domain_description}, ask me.
  - No problem. I'm still here for anything you need about {domain_description}.
  - Happy it helped. Anything else about {domain_description}?
  farewell:
  - Goodbye.
  - See you. Come back whenever you need to check the document.
  - Take care! I'll be here when you need to review the documents.
  - See you soon. We can keep checking whenever you like.
  - Bye, and thanks for asking.
  capability:
  - I'm {assistant_name}. I answer questions about {domain_description} quoting the exact text of the document. If the information is not there, I tell you instead of making up an answer.
  - I search {domain_description} and give you literal text with its source.
  - 'I''m {assistant_name}: I find the passage in {domain_description} that answers your question and show it as it is, with its quote.'
  - I only answer with what {domain_description} says, quoted word for word. If something is missing, I tell you.
  - 'Ask me about {domain_description}: I show you the exact text and where it appears, without making anything up.'
  opening:
  - 'This is what the document says:'
  - 'I found this in the document:'
  - 'The document puts it this way:'
  - 'According to the loaded text:'
  - 'Here is what I found:'
  addition:
  - 'It also adds:'
  - 'In another section, the document adds:'
  - 'It also says:'
  - 'And it continues:'
  - 'Besides, I found this:'
  condition:
  - 'This applies under a condition:'
  - 'There is an associated condition:'
  - 'The document makes it conditional:'
  - 'Keep this condition in mind:'
  - 'For it to apply, the document states:'
  exception:
  - 'With one exception:'
  - 'There is a caveat:'
  - 'The document includes an exception:'
  - 'Watch out for this exception:'
  - 'It does not apply in this case:'
  related_intro:
  - 'I couldn''t find a direct answer. This is what the documents say about the topic:'
  - 'There is no direct answer in the documents, but this is the most related:'
  - 'I didn''t find exactly what you are looking for. This is the closest in the documents:'
  - 'I don''t see a direct answer; here is what the documents say about the topic:'
  - 'What you ask does not appear directly. This is the related text I found:'
  missing_focus:
  - 'I couldn''t find specific information about «{term}». This is the closest:'
  - 'The documents do not specifically cover «{term}». This is the most similar:'
  - 'There is nothing specific about «{term}», but this is related:'
  - 'I didn''t find «{term}» in the documents. Here is the closest:'
  - 'There is no direct answer about «{term}». This is the related text:'
  no_answer:
  - I couldn't find that information in the available documents.
  - That information does not appear in the available documents.
  - I searched the documents and found nothing about that.
  - 'I don''t have that information: it is not in the loaded documents.'
  - Sorry, that is not in the available documents.
  premise_not_found:
  - I couldn't find information about "{entity}" in the available documents. It may not exist or be outside what your documents cover.
  - The documents do not mention "{entity}". It may be outside what they cover.
  - I didn't find "{entity}" in the available documents.
  - There is no information about "{entity}" in your documents; it may not be part of them.
  - I searched for "{entity}" and it does not appear in the available documents.
  welcome:
  - Hi, how can I help you?
  - Hi! Ask me anything about the documents.
  - Hello, I'm {assistant_name}. What would you like to check?
  - What would you like to know? I answer quoting the document.
  - Hi! Type your question and I will look for the answer in the text.
  waiting:
  - Searching the document
  - Reviewing the documents
  - Looking for the exact quote
  - One moment, I'm reading
  - Looking for the answer in the text
  citations_hint:
  - You can check it in the quote below.
  - The original text is below so you can verify it.
  - See the quote below to know where it comes from.
  - The exact source is right below.
  - Check it yourself in the quote below.
  network_error:
  - Could not reach the assistant. Check your connection and try again.
  - It seems there is no connection to the assistant. Try again in a moment.
  - I couldn't connect. Check your connection and try again.
  - The connection to the assistant was lost. Please try again.
  - I couldn't reach the service. Try again in a few seconds.
  rate_limit_error:
  - Too many questions in a row. Wait a few seconds and try again.
  - We are going a bit fast. Wait a few seconds before the next question.
  - I got many questions at once. Give me a few seconds and try again.
  - I need a short pause. Try again in a few seconds.
  - Wait a moment before asking again.
  service_error:
  - The assistant is not available right now. Try again later.
  - The service is getting ready. Try again in a moment.
  - I can't answer right now. Try again in a while.
  - The assistant is busy. Try again in a few seconds.
  - There was a problem with the service. Please try again later.
