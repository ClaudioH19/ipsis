# Cordial tone (default): kind and clear. The first variant of each situation
# is the text used before tones existed.
tone: cordial
description: Kind and clear; the default tone.
situations:
  greeting:
  - Hi! I'm {assistant_name}. I answer questions about {domain_description} quoting the exact text of the document. What do you need to know?
  - 'Hi! Ask me anything about {domain_description}: I look for the answer in the document and show you where I found it.'
  - Hello! {assistant_name} here. Tell me what you are looking for in {domain_description} and I will show you what the text says.
  - Hi, I'm {assistant_name}. What would you like to check in {domain_description}?
  - Nice to see you! Ask me anything about {domain_description} and I will show you the exact quote.
  - Hello, {assistant_name} here. Ask me about {domain_description} and I will show you the exact passage.
  - Hello. I am here to help with {domain_description}; every answer comes with its quote.
  - Hi, I'm {assistant_name}. Write your question about {domain_description} and I will look for it in the text.
  thanks:
  - You're welcome. If you have another question about {domain_description}, I'm here.
  - Glad to help. Any other question about {domain_description}, just ask.
  - My pleasure! If you want to check anything else in {domain_description}, ask me.
  - No problem. I'm still here for anything you need about {domain_description}.
  - Happy it helped. Anything else about {domain_description}?
  - Thank you too. If you need anything else about {domain_description}, ask any time.
  - Glad it helped. I am still available for {domain_description}.
  - My pleasure. Can I help with something else about {domain_description}?
  farewell:
  - Goodbye.
  - See you. Come back whenever you need to check the document.
  - Take care! I'll be here when you need to review the documents.
  - See you soon. We can keep checking whenever you like.
  - Bye, and thanks for asking.
  - Until next time.
  - Have a good day ahead.
  - Whenever you like, I will be here to keep looking things up.
  capability:
  - I'm {assistant_name}. I answer questions about {domain_description} quoting the exact text of the document. If the information is not there, I tell you instead of making up an answer.
  - I search {domain_description} and give you literal text with its source.
  - 'I''m {assistant_name}: I find the passage in {domain_description} that answers your question and show it as it is, with its quote.'
  - I only answer with what {domain_description} says, quoted word for word. If something is missing, I tell you.
  - 'Ask me about {domain_description}: I show you the exact text and where it appears, without making anything up.'
  - 'I''m {assistant_name}. I don''t write my own answers: I show you the passage of {domain_description} that answers and its source.'
  - I read {domain_description} for you and bring back the exact text, with where it appears.
  - If something isn't in {domain_description}, I tell you; if it is, I show you the quote.
