  - "Useful? If not, rephrase."
  - "If not this, add details."
  - "Does it answer you? If not, be specific."
  - "Check the passage. If it doesn't help, ask another way."
  - "Was this it? If not, say what's missing."
  - "If you meant something else, specify it."
  - "A match? If not, change the question."
