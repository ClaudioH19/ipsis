  - 'In accordance with the document:'
  - 'According to the available text:'
  - 'The following appears in the document:'
  - 'As recorded in the document:'
  - 'The relevant text reads as follows:'
  - 'Below is what the document states:'
  - 'In response to your inquiry, the document provides:'
  - 'The text records the following:'
  - 'The document addresses it in these terms:'
  - 'In this regard, the document states:'
  - 'Please find the corresponding passage below:'
