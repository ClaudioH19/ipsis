  - 'No specific information on «{term}» was found. The closest content is:'
  - 'The documents do not specifically address «{term}». The closest content is:'
  - 'There is no specific record of «{term}»; the related content follows:'
  - '«{term}» was not found in the documents. The closest content is:'
  - 'Regarding «{term}» there is no direct answer. The related content follows:'
  - 'The documents do not refer to «{term}». The most closely related content follows:'
  - 'No information on «{term}» is recorded. The related text is as follows:'
