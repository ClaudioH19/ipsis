  - 'It does not apply in the following case:'
  - 'The following case is excepted:'
  - 'With the caveat indicated below:'
  - 'It does not proceed in the following situation:'
  related_intro:
  - 'No direct answer was found. Here is what the documents state on the subject:'
  - 'The documents do not contain a direct answer; this is the most closely related content:'
  - 'There is no direct answer to your enquiry. The closest content is as follows:'
  - 'A direct answer cannot be provided. The documents indicate the following on the subject:'
  - 'Your enquiry has no direct answer in the documents. The related content is:'
  - 'No direct answer is recorded. The related content follows:'
  - 'It was not possible to find a direct answer; please find the most relevant text below:'
  - 'The documents do not answer your inquiry directly. The related content is as follows:'
  - 'Although there is no direct answer, the documents state the following on the matter:'
  - 'A direct answer is not available. Please see the closest content:'
  - 'No explicit answer is recorded. On this subject, the documents indicate:'
  - 'In the absence of a direct answer, the nearest text is shown below:'
