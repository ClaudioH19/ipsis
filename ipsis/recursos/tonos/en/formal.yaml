  - Good day. How may I assist you?
  - Welcome. Please state your enquiry.
  - This is {assistant_name}. What would you like to consult?
  - I am at your disposal. Every answer includes its source.
  - Please indicate your enquiry and I will show you the relevant text.
  - You may submit your inquiry whenever you wish.
  - At your service. Please indicate what you need.
