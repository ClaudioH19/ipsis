  - A connection problem occurred. Kindly try again in a few moments.
  - The service could not be reached. Please check your connection.
  - The connection to the assistant was interrupted. Please try again.
  - Communication with the service failed. Kindly try again later.
  - It was not possible to connect to the service. Please verify your connection.
  - Communication with the assistant failed. Please try again shortly.
