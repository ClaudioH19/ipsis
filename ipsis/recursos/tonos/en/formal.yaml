  no_answer:
  - Unfortunately, that information is not included in the available documents.
  - That information was not found in the available documents.
  - The available documents contain no information on your enquiry.
  - I regret to inform you that this information is not recorded in the documents.
  - 'Having reviewed the documents, your enquiry cannot be answered: the information is not included.'
  - The requested information is not found in the available documents.
  - The documents contain no information that would answer your inquiry.
  - 'I regret that I cannot answer: the documents do not address this matter.'
  - Your inquiry goes beyond the content of the available documents.
  - I have no information on that point in the documents.
  - Having reviewed the documents, no answer to your inquiry was found.
  - The loaded documents do not refer to that matter.
  premise_not_found:
  - No information about "{entity}" was found in the available documents. It may not exist or may fall outside their scope.
  - The documents make no reference to "{entity}".
  - There is no record of "{entity}" in the available documents.
  - I regret to inform you that "{entity}" does not appear in the documents.
  - Having reviewed the documents, no reference to "{entity}" was found.
  - The available documents do not mention "{entity}".
  - '"{entity}" was not found in the documents; it may fall outside their scope.'
  - I have no information on "{entity}" in the documents.
