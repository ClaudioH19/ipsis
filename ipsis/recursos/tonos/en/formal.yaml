  - The limit of consecutive enquiries has been reached. Kindly wait a few seconds.
  - Please wait a few seconds before your next enquiry.
  - Several enquiries were made in a short time. Please try again shortly.
  - Kindly wait a moment before continuing.
  - A few seconds are required before your next enquiry can be handled.
  - Please wait a few moments before submitting another inquiry.
  - The inquiry limit has been temporarily exceeded. Please try again shortly.
