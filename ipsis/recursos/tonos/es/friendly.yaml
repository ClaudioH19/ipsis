# Tono cercano: tuteo y lenguaje coloquial suave.
tone: friendly
description: Tuteo y lenguaje coloquial suave.
situations:
  greeting:
  - ¡Hola! Soy {assistant_name}. Cuéntame qué necesitas de {domain_description}.
  - ¡Hola, hola! ¿Qué buscamos hoy en {domain_description}?
  - Hola, por aquí {assistant_name}. Pregúntame lo que quieras de {domain_description}.
  - ¡Buenas! Dime qué te interesa de {domain_description} y lo buscamos.
  - ¡Hola! Te ayudo con {domain_description}, siempre con la cita a mano.
  thanks:
  - ¡De nada! Si te surge otra duda de {domain_description}, me dices.
  - ¡Para eso estoy! ¿Algo más de {domain_description}?
  - ¡Un gusto! Aquí sigo si necesitas algo más de {domain_description}.
  - ¡Cuando quieras! ¿Seguimos con {domain_description}?
  - Nada que agradecer. Si quieres, seguimos con {domain_description}.
  farewell:
  - ¡Adiós! Nos vemos.
  - ¡Nos vemos pronto!
  - ¡Cuídate! Aquí estaré.
  - ¡Hasta la próxima!
  - Bueno, nos vemos cuando quieras.
  capability:
  - Busco en {domain_description} y te muestro el texto tal cual, con su fuente. Si no está, te lo digo.
  - Soy {assistant_name}. Encuentro en {domain_description} lo que preguntas y te paso la cita exacta.
  - Lo mío es buscar en {domain_description} y mostrarte lo que dice, sin inventar nada.
  - Me preguntas algo de {domain_description} y te traigo el pedacito del texto que lo responde.
  - Leo {domain_description} por ti y te muestro de dónde sale cada respuesta.
  opening:
  - 'Mira, el documento dice:'
  - 'Te cuento lo que dice el texto:'
  - 'Esto es lo que encontré:'
  - 'Fíjate, según el documento:'
  - 'A ver, el texto dice así:'
  addition:
  - 'Y además dice:'
  - 'También aparece esto:'
  - 'Por otro lado, agrega:'
  - 'Y atención, también dice:'
  - 'Súmale esto:'
  condition:
  - 'Pero cuidado, aplica si:'
  - 'Hay una condición, eso sí:'
  - 'Fíjate en esta condición:'
  - 'Vale solo si:'
  - 'Con una condición:'
  exception:
  - 'Eso sí, hay una excepción:'
  - 'Menos en este caso:'
  - 'Cuidado con esta salvedad:'
  - 'Pero no aplica cuando:'
  - 'Hay una excepción, mira:'
  related_intro:
  - 'No encontré una respuesta directa, pero mira lo que hay sobre el tema:'
  - 'Justo eso no está, pero esto se le parece:'
  - 'No hay respuesta directa; te dejo lo más cercano:'
  - 'Eso no aparece tal cual. Lo más parecido es esto:'
  - 'No lo encontré directo, pero esto te puede servir:'
  missing_focus:
  - 'De «{term}» no encontré nada, pero mira esto:'
  - 'Uy, «{term}» no aparece. Lo más cercano es esto:'
  - 'Sobre «{term}» no hay nada puntual; te dejo lo relacionado:'
  - 'Busqué «{term}» y no está. Esto se le acerca:'
  - '«{term}» no sale en los documentos, pero mira:'
  no_answer:
  - Uy, eso no lo encuentro en tus documentos.
  - Eso no aparece en los documentos, lo siento.
  - Busqué y nada, eso no está en los documentos.
  - Mmm, eso no viene en los documentos que tengo.
  - No tengo eso en los documentos, ¿probamos con otra pregunta?
  premise_not_found:
  - Busqué "{entity}" y no aparece en tus documentos.
  - Uy, "{entity}" no sale en los documentos.
  - No encontré nada de "{entity}"; puede que no esté en lo que cargaste.
  - '"{entity}" no aparece por ningún lado en los documentos.'
  - Ni rastro de "{entity}" en los documentos, lo siento.
  welcome:
  - ¡Hola! ¿Qué necesitas?
  - ¡Hola! Pregúntame lo que quieras.
  - Hola, soy {assistant_name}. ¿Qué buscamos?
  - ¡Buenas! Dime qué te interesa.
  - Cuéntame tu duda y la buscamos.
  waiting:
  - Buscando…
  - Dame un segundo
  - Revisando los documentos
  - Ya casi
  - Buscando la cita
  citations_hint:
  - Mira la cita de abajo para comprobarlo.
  - Abajo tienes el texto original.
  - Si quieres verificarlo, la cita está abajo.
  - La fuente te la dejo aquí abajo.
  - Mira con calma la cita de abajo.
  network_error:
  - Uy, se cortó la conexión. ¿Lo intentas de nuevo?
  - No pude conectarme. Revisa tu internet y probamos otra vez.
  - Se cayó la conexión, inténtalo de nuevo en un rato.
  - Parece que no hay conexión. Inténtalo otra vez.
  - No llegué al servicio. ¿Pruebas de nuevo?
  rate_limit_error:
  - Vamos muy rápido. Espera unos segundos.
  - Muchas preguntas seguidas, dame un respiro.
  - Espérame un poquito y seguimos.
  - Para un segundo y vuelve a preguntar.
  - Con calma, en unos segundos seguimos.
  service_error:
  - Ahora no estoy disponible. Prueba más tarde.
  - Me estoy preparando, prueba en un momento.
  - Ahora no puedo responder, vuelve en un rato.
  - Tengo mucho trabajo, prueba en unos segundos.
  - Algo falló por acá. Intenta más tarde.
