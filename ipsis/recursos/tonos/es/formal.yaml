  - Puede verificarlo en la cita que se presenta a continuación.
  - El texto original figura abajo para su verificación.
  - Consulte la referencia inferior para comprobar su origen.
  - La fuente exacta se indica a continuación.
  - Le invito a verificarlo en la cita inferior.
  - A continuación se muestra el texto de origen.
  - Puede contrastar la respuesta con la cita inferior.
