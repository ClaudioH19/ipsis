  - Le ruego esperar un momento antes de continuar.
  - Es necesario esperar unos segundos para atender su siguiente consulta.
  - Le ruego aguardar unos instantes antes de formular otra consulta.
  - Se ha superado temporalmente el límite de consultas. Inténtelo en breve.
