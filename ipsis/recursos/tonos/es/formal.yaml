  - No fue posible establecer conexión con el asistente. Verifique su conexión e inténtelo nuevamente.
  - Se produjo un problema de conexión. Le ruego intentarlo de nuevo en unos momentos.
  - No se pudo contactar al servicio. Verifique su conexión, por favor.
  - La conexión con el asistente se interrumpió. Inténtelo nuevamente.
