  - Los documentos no hacen referencia a "{entity}".
  - No consta información sobre "{entity}" en los documentos disponibles.
  - Lamento informarle que "{entity}" no figura en los documentos.
  - Tras revisar los documentos, no se encontró referencia a "{entity}".
  - Los documentos disponibles no mencionan "{entity}".
  - No se halló "{entity}" en los documentos; es posible que exceda su alcance.
  - No dispongo de información sobre "{entity}" en los documentos.
  welcome:
  - Saludos. ¿En qué puedo asistirle?
  - Le doy la bienvenida. Formule su consulta, por favor.
  - Le saluda {assistant_name}. ¿Qué desea consultar?
  - Estoy a su disposición. Cada respuesta incluye su fuente.
  - Indíqueme su consulta y le mostraré el texto correspondiente.
  - Puede formular su consulta cuando lo desee.
  - Estoy a su servicio. Indíqueme qué necesita.
  waiting:
  - Consultando el documento
  - Revisando la documentación
  - Localizando la referencia exacta
  - Un momento, por favor
  - Buscando el pasaje pertinente
  - Examinando los documentos
  - Preparando la cita correspondiente
