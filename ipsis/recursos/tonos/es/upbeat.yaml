  - ¡Ups! No pude conectarme. Revisa tu conexión y probemos de nuevo.
  - ¡La conexión se fue de paseo! Intenta en un momento.
  - ¡Oh no, sin conexión! Vuelve a intentarlo.
  - ¡Vaya! No llegué al servicio. ¡Reintentemos!
