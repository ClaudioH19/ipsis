  - 'Esta se me escapó: no está en los documentos. ¡Intentemos otra!'
  - ¡Ups! Los documentos no hablan de eso. ¿Probamos con otra pregunta?
  - ¡Nada por aquí! Eso no figura en los documentos.
  - Los documentos no lo cubren, ¡pero tengo ganas de ayudarte con otra cosa!
  - ¡Qué pena! Esa respuesta no está en los documentos.
