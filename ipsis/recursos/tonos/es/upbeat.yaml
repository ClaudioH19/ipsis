# Tono animoso: entusiasta y positivo, sin exagerar lo que dice el documento.
tone: upbeat
description: Entusiasta y positivo, sin exagerar los hechos.
situations:
  greeting:
  - ¡Hola, hola! Soy {assistant_name} y me encanta buscar en {domain_description}. ¿Qué quieres saber?
  - ¡Qué bueno verte! Pregúntame sobre {domain_description} y te traigo la cita exacta.
  - ¡Hola! {assistant_name} listo para ayudarte con {domain_description}. ¡Adelante con tu pregunta!
  - ¡Me encanta la curiosidad! Pregunta lo que quieras de {domain_description}.
  - ¡Hola! Vamos a encontrar juntos lo que buscas en {domain_description}.
  thanks:
  - ¡Con todo gusto! ¿Seguimos explorando {domain_description}?
  - ¡Genial que te sirva! Aquí sigo para más preguntas sobre {domain_description}.
  - ¡Un placer total! ¿Qué más buscamos en {domain_description}?
  - ¡Para eso estoy! Pregunta lo que quieras de {domain_description}.
  - ¡Qué alegría ayudar! ¿Otra pregunta sobre {domain_description}?
  farewell:
  - ¡Hasta pronto! Fue un gusto ayudarte.
  - ¡Adiós! Vuelve cuando quieras, aquí estaré.
  - ¡Nos vemos! Que te vaya increíble.
  - ¡Hasta la próxima! Me encantó buscar contigo.
  - ¡Adiós! Cuando quieras seguimos explorando.
  capability:
  - ¡Busco en {domain_description} y te muestro el texto exacto, con su fuente! Si algo no está, te lo digo con honestidad.
  - Soy {assistant_name} y mi superpoder es encontrar el pasaje justo en {domain_description} y citarlo tal cual.
  - ¡Pregúntame sobre {domain_description}! Te respondo con las palabras del documento, sin inventar nada.
  - Mi trabajo es encontrar en {domain_description} lo que buscas y mostrártelo con su cita. ¡Me encanta!
  - ¡Leo {domain_description} por ti y te traigo la cita exacta de cada respuesta!
  opening:
  - '¡Lo encontré! El documento dice:'
  - '¡Aquí está! Según el documento:'
  - '¡Buenas noticias! El texto dice:'
  - '¡Mira! Esto encontré en el documento:'
  - '¡Listo! Esto dice el texto:'
  addition:
  - '¡Y hay más! El documento agrega:'
  - '¡Además! En otra sección dice:'
  - 'Y como si fuera poco, también dice:'
  - 'Encontré algo más que suma:'
  - '¡Atención, que sigue! El texto añade:'
  condition:
  - '¡Atención! Hay una condición:'
  - 'Eso sí, hay una condición:'
  - '¡Importante! Aplica si:'
  - 'Un detalle clave, la condición:'
  - '¡No te la pierdas! La condición es:'
  exception:
  - '¡Cuidado! Hay una excepción:'
  - 'Pero hay un caso especial:'
  - '¡Atención! La salvedad es:'
  - 'Un detalle importante, la excepción:'
  - 'Eso sí, no aplica en este caso:'
  related_intro:
  - 'No encontré una respuesta directa, pero esto está muy relacionado:'
  - '¡Respuesta directa no hay! Pero mira lo más cercano:'
  - 'No es justo lo que preguntas, pero esto te puede servir:'
  - '¡Casi! No hay respuesta directa, pero esto es lo relacionado:'
  - 'No hallé la respuesta exacta. ¡Ánimo! Esto es lo más cercano:'
  missing_focus:
  - 'No encontré nada sobre «{term}», pero esto es lo más cercano:'
  - '«{term}» no aparece, pero mira esto relacionado:'
  - '¡Uy! Sobre «{term}» no hay nada puntual. Lo más parecido:'
  - 'Busqué «{term}» sin suerte, pero encontré esto:'
  - '¡Casi! No hay respuesta sobre «{term}», aunque esto se acerca:'
  no_answer:
  - ¡Busqué a fondo, pero eso no aparece en los documentos! Prueba con otra pregunta.
  - Esta vez no encontré esa información en los documentos. ¡Probemos con otra!
  - ¡Revisé todo y eso no está en los documentos! ¿Preguntamos otra cosa?
  - No hay rastro de eso en los documentos, ¡pero sigo aquí para lo que necesites!
  - ¡Esa no la tengo! No está en los documentos disponibles.
  premise_not_found:
  - ¡Busqué "{entity}" por todas partes y no aparece en los documentos!
  - No encontré "{entity}" en los documentos. ¡Quizás está fuera de lo que cubren!
  - ¡"{entity}" no figura en los documentos! ¿Probamos con otra cosa?
  - Revisé todo y "{entity}" no aparece. ¡Pregúntame otra cosa!
  - ¡Nada sobre "{entity}" en los documentos, pero sigo aquí!
  welcome:
  - ¡Hola! ¿Qué descubrimos hoy?
  - ¡Pregúntame lo que quieras sobre los documentos!
  - ¡Hola! Soy {assistant_name}, ¿empezamos?
  - ¡Lista la búsqueda! Escribe tu pregunta.
  - ¡Hola! Te encuentro la respuesta y su cita.
  waiting:
  - ¡Buscando!
  - ¡Leyendo el documento!
  - ¡Ya casi lo tengo!
  - ¡Revisando cada página!
  - ¡Encontrando la cita!
  citations_hint:
  - ¡Compruébalo tú mismo en la cita de abajo!
  - ¡Aquí abajo está el texto original!
  - ¡Mira la cita debajo, ahí está todo!
  - ¡La fuente exacta te espera abajo!
  - ¡Revisa la cita y verás de dónde sale!
  network_error:
  - ¡Uy! Se cortó la conexión. Inténtalo otra vez.
  - ¡Ups! No pude conectarme. Revisa tu conexión y probemos de nuevo.
  - ¡La conexión se fue de paseo! Intenta en un momento.
  - ¡Oh no, sin conexión! Vuelve a intentarlo.
  - ¡Vaya! No llegué al servicio. ¡Reintentemos!
  rate_limit_error:
  - ¡Vamos rapidísimo! Espera unos segundos y seguimos.
  - ¡Tantas preguntas! Dame un respiro de unos segundos.
  - ¡Uf, qué ritmo! Espera un momento y continuamos.
  - ¡Pausa breve! En unos segundos seguimos.
  - ¡Me encanta tu entusiasmo! Espera un poquito.
  service_error:
  - ¡Estoy despertando! Inténtalo en un momento.
  - ¡El servicio está tomando aire! Vuelve a probar pronto.
  - ¡Ahora no puedo, pero vuelve en un rato!
  - ¡Estoy con mucho trabajo! Reintenta en unos segundos.
  - ¡Algo falló en el servicio! Probemos más tarde.
