  key_label: Si tu proyecto exige una clave, introdúcela aquí.
  key_apply: Aplicar clave
  footer: Consulta la información disponible. Las fuentes te permiten comprobar de dónde viene cada dato.
serve:
  examples: |
    Ejemplos (desde la carpeta del proyecto):
      ipsis serve                     Abre el widget y habilita el panel con un token temporal si falta uno.
      ipsis serve --no-open            Sirve widget y panel sin abrir el navegador.
      ipsis serve --no-demo --no-admin --no-open
                                      Sirve solo la API y los archivos del widget.
      ipsis serve ./documentos
                                      Prepara una carpeta documental antes de servirla.
      ipsis serve --demo --port 8123   Página de prueba en http://127.0.0.1:8123/widget/demo.html.
    La demo conserva el modo y las claves de acceso. Ctrl+C detiene el servicio.
  opt_demo: 'Página de prueba con los estilos del proyecto (activa por defecto; --no-demo la desactiva y no abre el navegador).'
  opt_open: 'Abre el widget cuando el servicio esté listo (activo por defecto; --no-open evita la apertura).'
  opt_admin: 'Panel de configuración activo por defecto; genera un token temporal si falta IPSIS_ADMIN_TOKEN. --no-admin lo desactiva.'
