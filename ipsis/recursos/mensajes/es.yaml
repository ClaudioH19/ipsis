  active: 'Perfil activo: {profile}'
  active_described: 'Perfil activo: {profile} ({description})'
  budget: 'Presupuesto p95: {ms} ms'
  models: 'Modelos:'
  role_dense: 'denso:'
  role_reranker: 'reranker:'
  role_reader: 'lector:'
  invalid_overrides: 'Error: los profile_overrides de config/engine.yaml no son válidos para {profile}: {error}'
  already_active: El perfil {profile} ya está activo. No se realizaron cambios.
  changed: 'Perfil cambiado: {old} → {new}'
  still_compatible: 'El índice actual sigue siendo compatible: no es necesario reindexar.'
  no_index_yet: 'Todavía no hay índice: el próximo ''ipsis index'' lo construirá para {profile}.'
  dense_changed: 'El modelo denso cambió: {old} → {new}. Hay que reconstruir el índice (el anterior se conserva).'
load:
  help: Copia un archivo o carpeta al corpus y lo cataloga.
  arg_path: Archivo o carpeta con .docx/.pdf/.md/.txt
