  warning: '      [!] {warning}'
  homonym: '      [!] ya había un documento con ese nombre ({doc_id!r}) y otro contenido: este se agregó aparte y ambos se indexan. Si lo reemplaza, marca ''active: false'' en la entrada de {doc_id!r} en documents/catalog.yaml y ejecuta ''ipsis index''.'
  done: '{n} documento(s) nuevo(s) agregado(s) al catálogo (documents/catalog.yaml).'
  next: 'Siguiente paso: ''ipsis index''.'
