demo:
  lang: es
  title: Encuentra lo que necesitas
  intro: Busca información y revisa las fuentes ordenadas por relevancia. Abre cada resultado para leer su contexto y sigue buscando si necesitas más opciones.
  navigation: Navegación
  admin: Administrar proyecto
