# Messages of the ipsis interface (CLI). English is the default; set IPSIS_LANG=es for Spanish.
# Variables go between braces ({name}); write a literal brace as {{ or }}.
cli:
  description: 'Respuestas extractivas sobre tus documentos: citas literales, abstención calibrada, solo CPU.'
  migration: '[migración] {change}'
  error: 'Error: {error}'
  error_dot: 'Error: {error}.'
  action: '  Acción: {action}'
  warning: 'Aviso: {warning}'
  warning_indented: '  Aviso: {warning}'
  item: '  - {item}'
  none: —
  subcommand: Comando a ejecutar.
  'yes': sí
  'no': 'no'
init:
  help: Crea la configuración de un dominio nuevo.
  opt_name: 'Nombre visible del asistente (por defecto: ''Asistente documental'', o su traducción).'
  opt_description: 'Descripción corta del dominio, p.ej. ''el manual de mi equipo'' (por defecto: ''los documentos cargados'').'
  opt_language: 'Código del idioma de los documentos (por defecto: en, o es con IPSIS_LANG=es). es, en y pt tienen paquete propio; otro código usa las reglas universales, sin stem, y los textos en inglés.'
  opt_profile: 'Perfil de instalación: light (sin modelos extra), medium o heavy (por defecto: medium).'
  opt_force: Reinicia config/assistant.yaml si ya existe.
  exists: Ya existe {path} -- usa 'ipsis configure clave=valor' para modificarlo, o 'ipsis init --force' para reiniciarlo desde los valores por defecto.
  styles_created: 'config/styles.yaml creado: ahí se cambia TODO el diseño del widget (colores, tipografía, formas, sombras y animaciones), sin tocar código.'
  done: 'Dominio inicializado en {path}:'
  name: '  assistant_name = {value!r}'
  description: '  domain_description = {value!r}'
  language_profile: '  language = {language!r}, profile = {profile!r}'
  fallback_note: '  Nota: no hay un paquete para {language!r}: se usan las reglas universales, términos sin stem y los textos en inglés (tradúcelos en config/language.yaml).'
  corpus_ready: Corpus vacío listo en documents/ (catálogo en {path}).
  engine_created: config/engine.yaml creado con umbrales genéricos de partida. La calibración se realiza al final, después de estabilizar la infraestructura.
  engine_kept: config/engine.yaml ya existía -- no se tocó.
  domain_created: 'config/domain.yaml creado: reglas y categorías propias de tu dominio (opcional).'
  domain_kept: config/domain.yaml ya existía -- no se tocó.
  next: 'Siguiente paso: ''ipsis load <archivo|carpeta>'', después ''ipsis index''.'
configure:
  help: Modifica config/assistant.yaml (clave=valor).
  arg_pairs: Uno o más pares clave=valor, p.ej. assistant_name='Mi asistente' cors_origins=https://mi-sitio.cl (varias claves separadas por espacio, varios valores de una lista separados por coma dentro del mismo valor).
  bad_pair: 'Error: {pair!r} no tiene la forma ''clave=valor''.'
  done: 'config/assistant.yaml actualizado:'
  value: '  {key} = {value!r}'
profile:
  help: Muestra o cambia el perfil de instalación (light, medium o heavy).
  show_help: Muestra el perfil activo, sus modelos, su presupuesto y si el índice y la calibración le sirven.
  set_help: Cambia el perfil activo e indica si hay que reindexar o recalibrar (no ejecuta nada costoso).
  arg_profile: 'Perfil de instalación destino: light, medium o heavy.'
  index_compatible: 'Índice: compatible (construido con {model}).'
  index_missing: 'Índice: todavía no existe; el próximo ''ipsis index'' lo construirá para {profile} ({model}).'
  index_incompatible: 'Índice: incompatible: se construyó con {built} y el perfil {profile} necesita {needed}.'
  calibration_none: 'Calibración: no hay (rigen los umbrales del perfil).'
  calibration_current: 'Calibración: vigente (sus umbrales están activos).'
  calibration_disabled: 'Calibración: guardada solo para auditoría, no se aplica ({reason}).'
  calibration_changed: La calibración anterior ya no corresponde al perfil activo
  calibration_stale: 'Calibración: obsoleta'
  calibration_kept: '{prefix} ({reason}). Rigen los umbrales del perfil; el archivo se conserva.'
