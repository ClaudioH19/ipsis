widget:
  help: Configura y exporta el widget embebible.
  theme_help: Administra presets visuales.
  style_help: Muestra o cambia cada valor de estilo.
  preset_row: '{name}: {description}'
  theme_list_help: Muestra los presets disponibles.
  theme_apply_help: Aplica un preset a styles.yaml.
  arg_preset: Nombre del preset visual.
  opt_styles: Archivo de estilos a modificar.
  preset_failed: 'No se pudo aplicar el preset: {error}'
  preset_applied: Preset {preset!r} aplicado en {path}
  preset_view: 'Vista activa: inicia el servicio y abre /widget/demo.html'
  preview_help: Genera un mockup HTML sin iniciar la API.
  opt_preview_styles: Archivo de estilos que se desea previsualizar.
  opt_html: Archivo HTML de salida.
  preview_failed: 'No se pudo generar la vista previa: {error}'
  preview_written: Vista previa escrita en {path}
  export_help: Copia widget.js y genera un snippet de integración.
  arg_folder: Directorio donde escribir los archivos.
  opt_api: URL pública de la API que consultará el widget.
  opt_position: Esquina donde se mostrará el botón.
  export_failed: 'No se pudo exportar el widget: {error}'
  exported: Widget exportado en {path}
  snippet_ready: Snippet listo en {path}
  snippet_help: Imprime el código para pegar el widget en tu sitio, según styles.yaml::placement.
  opt_service: URL pública del servicio (p. ej. https://asistente.tu-dominio.cl).
  opt_component: Usa el Web Component <ipsis-chat> en vez de los data-* del <script>.
  opt_key: Clave pública del widget (widget_keys), si usas.
  styles_error: 'Error: config/styles.yaml: {error}'
  style_show_help: Muestra cada valor de estilo del widget (colores, tipografía, forma, ubicación…).
  opt_section: Solo una sección.
  styles_unreadable: 'No se pudo leer config/styles.yaml: {error}'
  style_value: '{key} = {value}'
  style_how: 'Para cambiar: ipsis widget style set seccion.clave=valor'
  style_set_help: Cambia valores de estilo del widget, p. ej. colors.accent=#0ea5e9 shape.panel_radius=10px.
  arg_assignments: Uno o más cambios (ver 'ipsis widget style show').
  metavar_assignment: seccion.clave=valor
  nothing_changed: 'No se cambió nada: {error}'
  style_updated: Estilo actualizado en config/styles.yaml ({n} cambio(s)).
  style_live: 'El servicio lo aplica sin reiniciar; para verlo: ipsis widget theme preview'
deploy:
  help: Prepara el despliegue en un servidor propio.
  prepare_help: Genera una carpeta lista para copiar a un servidor (Docker, compose y Caddy opcional).
  opt_target: 'Carpeta de salida (por defecto: dist).'
  opt_domain: Dominio del servicio para HTTPS con Caddy.
  opt_wheel: Wheel de ipsis a instalar en la imagen.
  opt_force: Regenera una carpeta preparada antes.
  failed: 'No se pudo preparar el despliegue: {error}'
  done: 'Despliegue preparado en {path} (perfil {profile}, dominio {domain}): {n} archivos.'
  next: 'Siguiente paso: lee {path} y copia la carpeta al servidor.'
