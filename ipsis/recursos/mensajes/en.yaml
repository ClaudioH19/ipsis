# Messages of the ipsis interface (CLI). English is the default; set IPSIS_LANG=es for Spanish.
# Variables go between braces ({name}); write a literal brace as {{ or }}.
cli:
  description: 'Extractive answers from your documents: literal citations, calibrated abstention, CPU only.'
  migration: '[migration] {change}'
  error: 'Error: {error}'
  error_dot: 'Error: {error}.'
  action: '  Action: {action}'
  warning: 'Warning: {warning}'
  warning_indented: '  Warning: {warning}'
  item: '  - {item}'
  none: —
  subcommand: Command to run.
  'yes': 'yes'
  'no': 'no'
init:
  help: Create the configuration for a new project.
  opt_name: 'Visible name of the assistant (default: ''Document assistant'', or its translation).'
  opt_description: 'Short description of the domain, e.g. ''my team''s handbook'' (default: ''the loaded documents'').'
  opt_language: 'Language code of the documents (default: en, or es with IPSIS_LANG=es). es, en and pt have their own pack; any other code uses the universal rules, no stemming and English texts.'
  opt_profile: 'Installation profile: light (no extra models), medium or heavy (default: medium).'
  opt_force: Reset config/assistant.yaml if it already exists.
  exists: '{path} already exists -- use ''ipsis configure key=value'' to change it, or ''ipsis init --force'' to reset it to the defaults.'
  styles_created: 'config/styles.yaml created: the whole widget design lives there (colors, typography, shapes, shadows and animations), no code needed.'
  done: 'Project initialized in {path}:'
  name: '  assistant_name = {value!r}'
  description: '  domain_description = {value!r}'
  language_profile: '  language = {language!r}, profile = {profile!r}'
  fallback_note: '  Note: there is no pack for {language!r}: the universal rules, unstemmed terms and the English texts are used (translate them in config/language.yaml).'
  corpus_ready: Empty corpus ready in documents/ (catalog in {path}).
  engine_created: config/engine.yaml created with generic starting thresholds. Calibration comes last, once the setup is stable.
  engine_kept: config/engine.yaml already existed -- left untouched.
  domain_created: 'config/domain.yaml created: your own domain rules and categories (optional).'
  domain_kept: config/domain.yaml already existed -- left untouched.
  next: 'Next step: ''ipsis load <file|folder>'', then ''ipsis index''.'
configure:
  help: Change config/assistant.yaml (key=value).
  arg_pairs: One or more key=value pairs, e.g. assistant_name='My assistant' cors_origins=https://my-site.com (keys separated by spaces; list values separated by commas inside the same value).
  bad_pair: 'Error: {pair!r} is not of the form ''key=value''.'
  done: 'config/assistant.yaml updated:'
  value: '  {key} = {value!r}'
profile:
  help: Show or change the installation profile (light, medium or heavy).
  show_help: Show the active profile, its models and budget, and whether the index and calibration fit it.
  set_help: Change the active profile and tell whether to reindex or recalibrate (runs nothing expensive).
  arg_profile: 'Target installation profile: light, medium or heavy.'
  index_compatible: 'Index: compatible (built with {model}).'
  index_missing: 'Index: does not exist yet; the next ''ipsis index'' will build it for {profile} ({model}).'
  index_incompatible: 'Index: incompatible: it was built with {built} and the {profile} profile needs {needed}.'
  calibration_none: 'Calibration: none (the profile thresholds apply).'
  calibration_current: 'Calibration: current (its thresholds are active).'
  calibration_disabled: 'Calibration: saved for auditing only, not applied ({reason}).'
  calibration_changed: The previous calibration no longer matches the active profile
  calibration_stale: 'Calibration: stale'
  calibration_kept: '{prefix} ({reason}). The profile thresholds apply; the file is kept.'
  calibration_action: ipsis calibrate --apply (if you have an imported golden set)
  active: 'Active profile: {profile}'
  active_described: 'Active profile: {profile} ({description})'
  budget: 'p95 budget: {ms} ms'
  models: 'Models:'
  role_dense: 'dense:'
  role_reranker: 'reranker:'
  role_reader: 'reader:'
  invalid_overrides: 'Error: the profile_overrides in config/engine.yaml are not valid for {profile}: {error}'
  already_active: The {profile} profile is already active. Nothing changed.
  changed: 'Profile changed: {old} → {new}'
  still_compatible: 'The current index is still compatible: no need to reindex.'
  no_index_yet: 'There is no index yet: the next ''ipsis index'' will build it for {profile}.'
  dense_changed: 'The dense model changed: {old} → {new}. The index must be rebuilt (the previous one is kept).'
load:
  help: Copy a file or folder into the corpus and catalog it.
  arg_path: File or folder with .docx/.pdf/.md/.txt
  nothing: 'No supported file found in {path!r} (supported: .docx, .pdf, .md, .markdown, .txt).'
  duplicate: '  = {file}: already loaded as doc_id={doc_id!r} (same content, skipped)'
  added: '  + {file}: doc_id={doc_id!r}, title={title!r}'
  warning: '      [!] {warning}'
  homonym: '      [!] there was already a document with that name ({doc_id!r}) and different content: this one was added separately and both are indexed. If it replaces it, set ''active: false'' on the {doc_id!r} entry in documents/catalog.yaml and run ''ipsis index''.'
  done: '{n} new document(s) added to the catalog (documents/catalog.yaml).'
  next: 'Next step: ''ipsis index''.'
index:
  help: Parse, chunk, embed and store the index.
  opt_corpus: 'Folder with the documents to index (default: ''documents'').'
  config_error: 'Configuration error: {error}'
  run_doctor: Run 'ipsis doctor' for a full diagnosis.
  failed: 'Indexing failed: {error}'
  parsed: 'Documents parsed: {n}'
  document: '  - {doc_id}: {blocks} blocks, {chars} characters'
  chunks: 'Chunks generated: {n}'
  validation_errors: 'Ingestion validation errors: {n}'
  validation_error: '  ! {error}'
  warning: '  [!] {warning}'
  indexed: 'Indexed in collection {collection!r}: BM25 ({terms} terms), entity inventory ({entities} values).'
  time: 'Total time: {seconds:.1f}s'
  next: 'Next step: ''ipsis serve'' (or ''ipsis ask "..."'' if it is already serving).'
serve:
  help: Start the service API.
  arg_folder: Folder of documents or an existing project; it is prepared automatically.
  opt_host: 'Address the service listens on (default: ''127.0.0.1'', local only; use ''0.0.0.0'' to accept external connections).'
  opt_port: 'Port the service listens on (default: 8000).'
  opt_reindex: Rebuild the index even if the catalog did not change.
  opt_mode: 'production (default, or IPSIS_MODE): /admin requires HTTPS from outside. development: /admin over HTTP, /docs and no caching of the widget files.'
  development: 'Development mode: /admin accepts HTTP from any IP. Do not use it for a public service.'
  temporary_token: 'Temporary /admin token (this run only): {token}'
  no_folder: folder {path} does not exist
  no_documents: there are no supported documents in {path}
  init_failed: the automatic project could not be initialized
  load_failed: the documents could not be loaded
  preparing_index: Preparing the index before starting the service...
  index_failed: the index could not be built
  index_reused: The existing index is current; reusing it.
  active_project: 'Active project: {path}'
  serving: Serving on http://{host}:{port} (Ctrl+C to stop)...
  failed: 'The service could not be prepared: {error}'
ask:
  help: Ask the service from the terminal.
  arg_question: The question to send (quoted if it has spaces).
  opt_url: 'Base URL of the service (default: ''http://127.0.0.1:8000'').'
  opt_timeout: 'Seconds to wait for an answer before failing (default: 30).'
  opt_diagnostics: Run the question with the project engine in this process (without the service) and show the stages with their latency, signals, focus terms, the deciding rule and the exact span. With local Qdrant, stop 'ipsis serve' first.
  status_ok: '[OK]'
  status_related: '[RELATED -- not a direct answer]'
  status_no_answer: '[NO ANSWER]'
  status_conversational: '[CONVERSATIONAL]'
  status_degraded: '[DEGRADED]'
  status_saturated: '[SATURATED]'
  no_connection: Could not connect to {url}. Is the service up? Run 'ipsis serve' first.
  timeout: The service did not answer within {seconds}s.
  http_error: 'The service answered {status}: {body}'
  citations: '

    Citations:'
  citation: '  - {title} > {section} (offsets {start}-{end}, score={score:.3f})'
  not_ready: 'The engine is not ready: {error}'
  engine_failed: 'The project engine could not run: {error}'
  rule: '

    Rule: {rule} (reason: {reason}; profile: {profile})'
  stages: 'Stages (ms):'
  early_exit: '   (early exit: no models)'
  signals: 'Signals:'
  focus: 'Focus terms: found: {found}; missing: {missing}'
  absent: 'Terms not in the corpus: {terms}'
  sentence: 'Evaluated sentence: «{sentence}»'
  span: 'Exact span: «{text}» ({chunk_id}, offsets {start}-{end})'
  no_span: 'Exact span: —'
  evidence: 'Evidence: {doc_id} offsets {start}-{end}'
  tone: 'Tone: {tone}; templates: {templates}'
  warning: 'Warning: {warning}'
doctor:
  help: 'Read-only diagnosis: configuration, profile, language, models, index, calibration, golden and CORS.'
