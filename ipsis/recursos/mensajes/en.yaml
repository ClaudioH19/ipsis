  opt_host: 'Address the service listens on (default: ''127.0.0.1'', local only; use ''0.0.0.0'' to accept external connections).'
  opt_port: 'Port the service listens on (default: 8000).'
  opt_reindex: Rebuild the index even if the catalog did not change.
  opt_mode: 'production (default, or IPSIS_MODE): /admin requires HTTPS from outside. development: /admin over HTTP, /docs and no caching of the widget files.'
