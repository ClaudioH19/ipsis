# Messages of the ipsis interface (CLI). English is the default; set IPSIS_LANG=es for Spanish.
# Variables go between braces ({name}); write a literal brace as {{ or }}.
cli:
  description: 'Extractive answers from your documents: literal citations, calibrated abstention, CPU only.'
  migration: '[migration] {change}'
  error: 'Error: {error}'
  error_dot: 'Error: {error}.'
  action: '  Action: {action}'
  warning: 'Warning: {warning}'
  warning_indented: '  Warning: {warning}'
  item: '  - {item}'
  none: '-'
  subcommand: Command to run.
  'yes': 'yes'
  'no': 'no'
prepare:
  help: Prepare DOCX and a preview in an independent project copy.
  project: Read-only source project.
  output: New folder outside the original project.
  index: Also build the separate structural index with the profile models.
  done: 'Prepared {documents} documents, {units} source units and {children} searchable fragments.'
  preview: 'Preview: {path}'
  project_done: 'Experimental project: {path}'
init:
  help: Create the configuration for a new project.
  opt_name: 'Visible name of the assistant (default: ''Document assistant'', or its translation).'
  opt_description: 'Short description of the domain, e.g. ''my team''s handbook'' (default: ''the loaded documents'').'
  opt_language: 'Language code of the documents (default: en, or es with IPSIS_LANG=es). es, en and pt have their own pack; any other code uses the universal rules, no stemming and English texts.'
  opt_profile: 'Installation profile: light (no extra models) or medium (default: medium).'
  opt_force: Reset config/assistant.yaml if it already exists.
  exists: '{path} already exists -- use ''ipsis configure key=value'' to change it, or ''ipsis init --force'' to reset it to the defaults.'
  styles_created: 'config/styles.yaml created: the whole widget design lives there (colors, typography, shapes, shadows and animations), no code needed.'
  done: 'Project initialized in {path}:'
  name: '  assistant_name = {value!r}'
  description: '  domain_description = {value!r}'
  language_profile: '  language = {language!r}, profile = {profile!r}'
  fallback_note: '  Note: there is no pack for {language!r}: the universal rules, unstemmed terms and the English texts are used (translate them in config/language.yaml).'
  corpus_ready: Empty corpus ready in documents/ (catalog in {path}).
  engine_created: config/engine.yaml created with generic starting thresholds. Calibration comes last, once the setup is stable.
  engine_kept: config/engine.yaml already existed -- left untouched.
  domain_created: 'config/domain.yaml created: your own domain rules and categories (optional).'
  domain_kept: config/domain.yaml already existed -- left untouched.
  next: 'Next step: ''ipsis load <file|folder>'', then ''ipsis index''.'
configure:
  help: Change config/assistant.yaml (key=value).
  arg_pairs: One or more key=value pairs, e.g. assistant_name='My assistant' cors_origins=https://my-site.com (keys separated by spaces; list values separated by commas inside the same value).
  bad_pair: 'Error: {pair!r} is not of the form ''key=value''.'
  done: 'config/assistant.yaml updated:'
  value: '  {key} = {value!r}'
profile:
  help: Show or change the installation profile (light or medium).
  show_help: Show the active profile, its models and budget, and whether the index and calibration fit it.
  set_help: Change the active profile and tell whether to reindex or recalibrate (runs nothing expensive).
  arg_profile: 'Target installation profile: light or medium.'
  index_compatible: 'Index: compatible (built with {model}).'
  index_missing: 'Index: does not exist yet; the next ''ipsis index'' will build it for {profile} ({model}).'
  index_incompatible: 'Index: incompatible: it was built with {built} and the {profile} profile needs {needed}.'
  calibration_none: 'Calibration: none (the profile thresholds apply).'
  calibration_current: 'Calibration: current (its thresholds are active).'
  calibration_disabled: 'Calibration: saved for auditing only, not applied ({reason}).'
  calibration_changed: The previous calibration no longer matches the active profile
  calibration_stale: 'Calibration: stale'
  calibration_kept: '{prefix} ({reason}). The profile thresholds apply; the file is kept.'
  calibration_action: ipsis calibrate --apply (if you have an imported golden set)
  active: 'Active profile: {profile}'
  active_described: 'Active profile: {profile} ({description})'
  budget: 'p95 budget: {ms} ms'
  models: 'Models:'
  role_dense: 'dense:'
  role_reranker: 'reranker:'
  role_reader: 'reader:'
  invalid_overrides: 'Error: the profile_overrides in config/engine.yaml are not valid for {profile}: {error}'
  already_active: The {profile} profile is already active. Nothing changed.
  changed: 'Profile changed: {old} → {new}'
  still_compatible: 'The current index is still compatible: no need to reindex.'
  no_index_yet: 'There is no index yet: the next ''ipsis index'' will build it for {profile}.'
  dense_changed: 'The dense model changed: {old} → {new}. The index must be rebuilt (the previous one is kept).'
load:
  help: Copy a file or folder into the corpus and catalog it.
