messages:
  welcome:
    - Olá. Escreva uma pergunta e confira as fontes ordenadas por relevância.
    - Bem-vindo. Você pode pesquisar por pergunta, nome, código ou palavras-chave.
    - De qual informação você precisa? Comece com uma pergunta sobre seus documentos.
    - Explore seus documentos. Abra os resultados para ler o contexto.
    - Olá. Ajudo a encontrar trechos para que você possa verificar as informações.
    - Comece com o que procura. Reformule a consulta se precisar de outras opções.
    - Bem-vindo. Aqui você encontra fontes com referências e contexto para conferir.
    - Procura um valor ou uma explicação? Escreva o tema e o que precisa saber.
    - Olá. Tente uma pergunta específica ou o identificador de um produto.
    - Seus documentos são o ponto de partida. Escreva uma consulta para explorá-los.
  greeting:
    - Olá, como posso ajudar hoje?
    - Bom dia. Você pode começar com uma pergunta ou palavras-chave.
    - Oi. Conte o que precisa e podemos começar.
    - Bem-vindo. Qual informação gostaria de conferir?
    - Olá. Estou pronto para pesquisar as fontes do seu projeto.
    - Oi. Você pode consultar um nome, código ou tema.
    - Olá. Se precisar de orientação, selecione Como pesquisar.
    - Prazer em conhecer você. Qual informação precisa encontrar?
    - Oi. Abra um resultado para ver o contexto do documento.
    - Bem-vindo de volta. Escreva sua próxima consulta quando quiser.
  thanks:
    - De nada, foi um prazer ajudar.
    - Foi um prazer. Confira a fonte antes de usar a informação.
    - Obrigado. Os resultados continuam disponíveis para consulta.
    - Que bom que foi útil. Estou aqui se precisar de mais alguma coisa.
    - De nada. Abra o resultado se precisar de mais contexto.
    - Foi um prazer. Uma consulta mais específica pode aproximar você do dado que procura.
    - Obrigado. Você pode voltar às fontes mostradas quando quiser.
    - De nada. Tente outras palavras-chave se ainda tiver dúvidas.
    - Foi um prazer. Você pode pesquisar outro tema nesta página.
    - Obrigado. Continue explorando seus documentos por aqui.
  farewell:
    - Até logo. Tenha um bom dia.
    - Tchau. Os documentos estarão aqui para sua próxima consulta.
    - Até mais. Confira as fontes que pretende utilizar.
    - Até breve. Você pode retomar a pesquisa nesta página.
    - Tenha um bom dia. Volte quando precisar consultar um documento.
    - Tchau por enquanto. Obrigado por conferir as fontes do projeto.
    - Até logo. Você pode deixar os resultados abertos para ler depois.
    - Até breve. Escreva outra consulta se decidir continuar.
    - Tchau. Espero que a revisão dos documentos seja útil para você.
    - Até a próxima. Esta página continua disponível para pesquisa.
  capability:
    - Pesquiso nos documentos carregados e mostro fontes ordenadas para você conferir.
    - Você pode consultar temas, nomes ou códigos e abrir o contexto de cada resultado.
    - Ajudo a localizar informações. Você pode verificar qual fonte responde à pergunta.
    - Mostro trechos do projeto com referências; você pode pedir mais resultados quando disponíveis.
    - Você pode pesquisar valores de inventário, instruções ou textos dos documentos carregados.
    - Recupero texto documental. Não calculo estoque nem altero valores de inventário.
    - Confira as primeiras opções, abra os trechos ou reformule a pesquisa com outro termo.
    - Ajudo a encontrar fontes sem escrever uma resposta nova a partir delas.
    - Pesquise com linguagem natural ou palavras-chave. Cada resultado permite conferir sua origem.
    - A pesquisa abrange este projeto. O painel de administração permite gerenciar seus documentos.
  tips:
    - Inclua o tema e o valor que procura, como estoque do produto junto ao código.
    - Se souber um nome ou identificador, escreva como aparece no documento.
    - Pesquise uma coisa por vez para facilitar a comparação das fontes.
    - Se faltarem opções, tente um termo mais geral e leia o contexto.
    - Abra cada resultado para ler o trecho completo e conferir sua relação com a pergunta.
    - Mude as palavras-chave se os primeiros resultados não forem úteis.
    - Use Mostrar mais resultados quando disponível para conferir outras opções da mesma lista.
    - Em uma tabela, leia os cabeçalhos junto à linha que contém o dado.
    - Acrescente o nome do manual, produto ou tema se a consulta for muito ampla.
    - Confira a referência e a versão do documento antes de usar um dado.
  searching:
    - Pesquisando fontes nos seus documentos…
    - Conferindo opções para esta consulta…
    - Recuperando trechos relacionados…
    - Consultando o índice do projeto…
    - Ordenando os resultados da pesquisa…
    - Pesquisando o tema que você indicou…
    - Preparando as fontes para consulta…
    - Localizando possíveis correspondências…
    - Pesquisando nos documentos carregados…
    - Recuperando opções com seu contexto…
  results:
    - "{count} para conferir. Abra cada fonte para verificar se responde à pergunta."
    - "{count}. As fontes estão ordenadas por relevância e a primeira também precisa ser verificada."
    - "Você já pode ler {count}. O contexto ajuda a distinguir dados semelhantes."
    - "{count}. Abra o trecho que interessa e confira seu documento de origem."
    - Compare as opções antes de escolher qual informação utilizar.
    - Estas são possíveis fontes. Reformule a consulta para procurar outras opções.
    - Se o dado estiver em uma tabela, confira também os cabeçalhos das colunas.
    - Os resultados preservam o texto do documento. Leia o contexto da correspondência.
    - Continue lendo as fontes ou escreva uma consulta mais específica.
    - Confira o documento e sua versão ao verificar a informação encontrada.
  continuation:
    - "Agora há {count} na lista. Compare as novas opções com as anteriores."
    - "A pesquisa continua: {count} até agora. Abra as novas opções para ler o contexto."
    - A pesquisa continua. Abra as novas opções para ler o contexto.
    - Confira os resultados adicionados; as opções anteriores continuam na lista.
    - Compare estes trechos com as primeiras fontes mostradas.
    - Há mais opções para a mesma consulta. Confira qual delas é útil.
    - Adicionamos outros resultados sem repetir os já mostrados.
    - Continue conferindo as fontes ou mude a consulta para tentar outra abordagem.
    - As novas opções aparecem depois dos resultados anteriores.
    - Confira estes trechos adicionais com suas referências.
  no_results:
    - Não há fontes para mostrar nesta pesquisa. Tente outras palavras-chave.
    - Nenhuma opção foi recuperada. Confira o nome ou código que escreveu.
    - Tente uma consulta mais geral ou acrescente o nome do documento.
    - Esta pesquisa não retornou fontes. Você pode reformular a pergunta.
    - Confira se o documento necessário está carregado no projeto.
    - Não há opções para conferir aqui. Tente pesquisar o tema separadamente.
    - Use um sinônimo ou uma palavra que lembra do documento.
    - Tente o identificador completo se procura um produto ou registro.
    - Nenhuma fonte foi mostrada. Divida a consulta em perguntas mais curtas.
    - Tente outra pesquisa e confira os documentos disponíveis no painel.
  about:
  - Sou o ipsis, seu assistente para consultar os documentos deste projeto.
  - Trabalho com os textos carregados aqui. Cada resultado mostra de onde vem.
  - Apresento trechos dos documentos junto com o contexto para facilitar a leitura.
  - As mensagens de boas-vindas e ajuda são textos da interface, separados do conteúdo documental.
  - Selecione o título para abrir o contexto. O caminho das seções mostra onde o trecho aparece.
  - Você pode cumprimentar, agradecer ou se despedir; também posso ajudar a começar.
  limits:
  - Minhas informações vêm dos documentos carregados neste projeto.
  - Um resultado relacionado pode oferecer contexto sem responder exatamente à sua pergunta.
  - Se um dado não aparece nos documentos, não posso completá-lo com informações inventadas.
  - Os valores de uma tabela pertencem ao documento e à versão indicados na fonte.
  - Localizo textos; cálculos e decisões exigem conferir os dados de origem.
  - As perguntas de exemplo são pontos de partida; adapte-as aos seus documentos.
  examples:
  - Para encontrar um procedimento, pergunte “Quais passos devo seguir?” e acrescente o nome do processo.
  - Para conferir condições, pergunte “Quais são os requisitos?” junto com o procedimento ou produto.
  - Para encontrar uma data, pergunte “Qual é o prazo?” e especifique a atividade.
  - Para localizar um responsável, pergunte “Quem está encarregado?” e acrescente a tarefa.
  - Para ler uma definição, pergunte “O que significa este termo?” e escreva o termo específico.
  - Para encontrar uma exceção, pergunte “Em quais casos se aplica?” e acrescente a regra.
suggestions:
- Quais passos devo seguir?
- Quais são os requisitos?
- Qual é o prazo?
- Quem está encarregado?
- O que significa este termo?
- Em quais casos se aplica?
