  capability:
    - I search loaded documents and display ranked sources for you to review.
    - You can look up topics, names or codes and open the context of each result.
    - I help locate information. You can check which source answers your question.
    - I show project passages with references; you can request more results when available.
    - You can search inventory values, instructions or text in the loaded documents.
    - I retrieve document text. I do not calculate stock or change inventory values.
    - You can review the first options, open them or rephrase the search with another term.
    - I help find sources without writing a new answer from their content.
    - Search with natural language or keywords. Each result lets you check its origin.
    - Search covers this project. The administration panel lets you manage its documents.
  tips:
    - Include the topic and the value you need, such as product stock along with its code.
    - If you know a name or identifier, enter it as it appears in the document.
    - Search for one thing at a time to make sources easier to compare.
    - If options are missing, try a broader term and read the context.
    - Open each result to read the full passage and check its connection to your question.
    - Change the keywords if the first results are not useful.
    - Use Show more results when available to review more options from the same ranking.
    - For a table, read the headers along with the row containing the value.
    - Add the manual, product or topic name if your query is too broad.
    - Check the document reference and version before using a value.
  searching:
    - Searching your documents for sources…
    - Reviewing options for this query…
    - Retrieving related passages…
    - Looking up the project index…
    - Ranking the search results…
    - Searching for the topic you entered…
    - Preparing sources for review…
    - Locating possible matches…
    - Searching the loaded corpus…
    - Retrieving options with their context…
  results:
    - Review these options. Open each source to check whether it answers your question.
    - Sources are ranked by relevance. The first option still needs verification.
    - You can now read the results. Context helps distinguish similar values.
    - Open the passage you need and check its source document.
    - Compare the options before choosing which information to use.
    - These are possible sources. Rephrase the query to look for different options.
    - If the value is in a table, check the column headers too.
    - Results preserve the document text. Review the context around the match.
    - Keep reading the sources or enter a more specific query.
    - Check the document and its version when verifying the information you found.
  continuation:
    - New options were added to the list. Compare them with the earlier results.
    - Here are more sources from the same ranking for review.
    - The search continues. Open the new options to read their context.
    - Review the added results; the earlier options remain in the list.
    - Compare these passages with the first sources shown.
    - More options for the same query are available. Check which one is useful.
    - We added other results without repeating those already displayed.
    - Keep reviewing sources or change the query if you need another approach.
    - The new options appear after the earlier results.
    - Review these additional passages with their references.
  no_results:
    - No sources are available for this search. Try different keywords.
    - No options were retrieved. Check the name or code you entered.
    - Try a broader query or add the document name.
    - This search returned no sources. You can rephrase the question.
    - Check whether the document you need is loaded in the project.
    - There are no options to review here. Try searching the topic separately.
    - Use a synonym or a word you remember from the document.
    - Try the full identifier if you are searching for a product or record.
    - No sources were shown. Split the query into shorter questions.
    - Try another search and check the available documents in the panel.
  about:
  - I am ipsis, your assistant for exploring this project's documents.
  - I work with the texts loaded here. Each result shows where it comes from.
  - I present document passages alongside their context to make them easier to read.
  - Welcome and help messages are interface text, separate from the document content.
  - Select a result title to open its context. The section path shows where the passage appears.
  - You can say hello, thank me or say goodbye; I can also help you get started.
  limits:
  - My information comes from the documents loaded in this project.
  - A related result can offer context without answering your exact question.
  - If a value is missing from the documents, I cannot fill it in with invented information.
  - Table values belong to the document and version shown with the source.
  - I locate text; calculations and decisions require checking the original data.
  - Example questions are starting points; adapt them to your documents.
  examples:
  - To find a procedure, ask “What steps should I follow?” and add the process name.
  - To check conditions, ask “What are the requirements?” alongside the procedure or product.
  - To find a date, ask “What is the deadline?” and specify the activity.
  - To find a responsible person, ask “Who is in charge?” and add the task.
  - For a definition, ask “What does this term mean?” and enter the specific term.
  - To find an exception, ask “When does this apply?” and add the rule.
suggestions:
- What steps should I follow?
- What are the requirements?
- What is the deadline?
- Who is in charge?
- What does this term mean?
- When does this apply?
