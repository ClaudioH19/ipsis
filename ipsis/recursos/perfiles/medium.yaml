# Installation profile "medium". A project adjusts it in config/engine.yaml
# (profile_overrides) and `ipsis calibrate` replaces the default thresholds.
# See docs/decisions/0003-onnx-and-profiles.md.
profile: medium
description: Light plus a cross-encoder reranker and an extractive QA reader.
p95_budget_ms: 1000
models:
  dense: intfloat/multilingual-e5-small
  reranker: cross-encoder/mmarco-mMiniLMv2-L12-H384-v1
  reader: dewdev/mdeberta-v3-base-squad2-onnx
cascade:
  retrieve_n: 20
  rerank_k: 4
  read_m: 2
  max_passage_tokens: 384
  stride: 128
  early_exit_without_focus: true
  max_reading_chars: 600
stages:
- conversational
- analysis
- confidence
- filters
- retrieval
- reranking
- reading
- evidence
- policy
- rendering
- verification
lexical:
  k1: 1.2
  b: 0.75
  max_focus_terms: 2
default_thresholds:
  oov_domain: 0.6
  oov_ok: 0.6
  domain: 0.33
  related: 0.33
  focus: 1.0  # la oración que responde tiene todos los términos foco (ADR 0005)
  ok: 0.8
  cov: 0.6
# Alternatives of the proactive posture (ADR 0008): affinity = weighted mean
# of the signals; offered when it reaches the threshold. Calibrated with
# tests/datos/banco_alternativas (precision >= 0.9, widest margin): the family
# of a missing declared entity, or a line with nearly all the question words.
alternatives:
  threshold: 0.5
  weights:
    family: 1.0
    measure: 0.0
    terms: 2.0
    section: 0.0
    keywords: 0.0
    category: 0.0
    similarity: 0.0
