# Installation profile "medium". A project adjusts it in config/engine.yaml
# (profile_overrides).
# See docs/decisions/0003-onnx-and-profiles.md.
profile: medium
description: Light plus a cross-encoder reranker (a larger one for Spanish and Portuguese); the extractive QA reader is used only for the optional highlights (v2.qa_highlights).
p95_budget_ms: 1000
models:
  dense: intfloat/multilingual-e5-small
  reranker: cross-encoder/mmarco-mMiniLMv2-L12-H384-v1
  reader: dewdev/mdeberta-v3-base-squad2-onnx
# A project in one of these languages uses that reranker with that many candidates (v2): a larger
# cross-encoder that separates passages of the same topic better (docs/methodology/precision-ingesta.md).
# Other languages keep `models.reranker`. A project that sets `profile_overrides.models.reranker` keeps its own.
language_rerankers:
  es: onnx-community/bge-reranker-v2-m3-ONNX
  pt: onnx-community/bge-reranker-v2-m3-ONNX
language_rerank_candidates:
  es: 10
  pt: 10
