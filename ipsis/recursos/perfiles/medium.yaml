# Installation profile "medium". A project adjusts it in config/engine.yaml
# (profile_overrides) and `ipsis calibrate` replaces the default thresholds.
# See docs/decisions/0003-onnx-and-profiles.md.
profile: medium
description: Light plus a cross-encoder reranker (a larger one for Spanish and Portuguese); the extractive QA reader is used only by the optional v1 engine.
p95_budget_ms: 1000
models:
  dense: intfloat/multilingual-e5-small
  reranker: cross-encoder/mmarco-mMiniLMv2-L12-H384-v1
  reader: dewdev/mdeberta-v3-base-squad2-onnx
cascade:
  retrieve_n: 20
  rerank_k: 4
  # The reranker scores only the first 5 fused candidates: with semantic reading the fine
  # ordering is per sentence, and scoring 20 long chunks cost 4 s for the same answers.
  rerank_candidates: 5
  read_m: 2
  max_passage_tokens: 384
  stride: 128
  early_exit_without_focus: true
  max_reading_chars: 600
  # The reader reads the 3 sentences ranked first by a fusion of cross-encoder, dense
  # cosine and s_lex (docs/methodology/informal-paraphrases.md), not a word-overlap window.
  semantic_reading: true
stages:
- conversational
- analysis
- confidence
- filters
- retrieval
- reranking
- reading
- evidence
- policy
- rendering
- verification
lexical:
  k1: 1.2
  b: 0.75
  max_focus_terms: 2
# A project in one of these languages uses that reranker with that many candidates (v2): a larger
# cross-encoder that separates passages of the same topic better (docs/plan/precision-ingesta-avance.md).
# Other languages keep `models.reranker`. A project that sets `profile_overrides.models.reranker` keeps its own.
language_rerankers:
  es: onnx-community/bge-reranker-v2-m3-ONNX
  pt: onnx-community/bge-reranker-v2-m3-ONNX
language_rerank_candidates:
  es: 10
  pt: 10
default_thresholds:
  oov_domain: 0.6
  oov_ok: 0.6
  domain: 0.33
  related: 0.33
  focus: 1.0  # la oración que responde tiene todos los términos foco (ADR 0005)
  ok: 0.8
  cov: 0.6
  # Second ok tier: with the reader nearly sure, an informal question may carry more
  # words the corpus lacks ("quien anota las muestras"). See docs/methodology/policy.md.
  ok_strong: 0.99
  oov_ok_strong: 0.67
  # A colloquial question ("cuanta plata sale el almuerzo") with the reader at ok_strong
  # needs only half of the focus terms in the answering sentence (ipsis.lenguaje.estilo).
  focus_informal: 0.5
# Alternatives of the proactive posture (ADR 0008): affinity = weighted mean
# of the signals; offered when it reaches the threshold. Calibrated with
# tests/datos/banco_alternativas (precision >= 0.9, widest margin): the family
# of a missing declared entity, or a line with nearly all the question words.
alternatives:
  threshold: 0.5
  weights:
    family: 1.0
    measure: 0.0
    terms: 2.0
    section: 0.0
    keywords: 0.0
    category: 0.0
    similarity: 0.0
