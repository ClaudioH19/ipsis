# Diagnostic profile for `ipsis benchmark`; it is not installable.
profile: bm25
description: 'ipsis benchmark diagnostic: retrieves with BM25 only (no dense vector).
  The domain signal s_ret is still the dense cosine. Not installable.'
p95_budget_ms: 100
models:
  dense: intfloat/multilingual-e5-small
  reranker: null
  reader: null
cascade:
  retrieve_n: 10
  rerank_k: 0
  read_m: 0
  max_passage_tokens: 384
  stride: 128
  early_exit_without_focus: true
stages:
- conversational
- analysis
- confidence
- filters
- retrieval
- evidence
- policy
- rendering
- verification
lexical:
  k1: 1.2
  b: 0.75
  max_focus_terms: 2
default_thresholds:
  oov_domain: 0.6
  oov_ok: 0.6
  domain: 0.33
  related: 0.33
  focus: 1.0  # la oración que responde tiene todos los términos foco (ADR 0005)
  ok: 0.5
  cov: 0.6
retrieval_mode: sparse
# Alternatives of the proactive posture (ADR 0008): affinity = weighted mean
# of the signals; offered when it reaches the threshold. Calibrated with
# tests/datos/banco_alternativas (precision >= 0.9, widest margin): only the
# family of the missing entity counts.
alternatives:
  threshold: 0.5
  weights:
    family: 1.0
    terms: 0.0
    section: 0.0
    keywords: 0.0
    category: 0.0
    similarity: 0.0
