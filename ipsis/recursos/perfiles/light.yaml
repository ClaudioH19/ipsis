# Installation profile "light". A project adjusts it in config/engine.yaml
# (profile_overrides) and `ipsis calibrate` replaces the default thresholds.
# See docs/decisions/0003-onnx-and-profiles.md.
profile: light
description: Hybrid retrieval and lexical signals, without reranking or reading models.
p95_budget_ms: 150
models:
  dense: intfloat/multilingual-e5-small
  reranker: null
  reader: null
cascade:
  retrieve_n: 10
  rerank_k: 0
  read_m: 0
  max_passage_tokens: 384
  stride: 128
  early_exit_without_focus: true
stages:
- conversational
- analysis
- confidence
- filters
- retrieval
- evidence
- policy
- rendering
- verification
lexical:
  k1: 1.2
  b: 0.75
  max_focus_terms: 2
default_thresholds:
  oov_domain: 0.6
  oov_ok: 0.6
  domain: 0.33
  related: 0.33
  focus: 0.5
  ok: 0.5
  cov: 0.6
