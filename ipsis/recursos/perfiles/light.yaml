# Installation profile "light". A project adjusts it in config/engine.yaml
# (profile_overrides).
# See docs/decisions/0003-onnx-and-profiles.md.
profile: light
description: Hybrid retrieval (dense vectors plus BM25), without reranking or reading models.
p95_budget_ms: 150
models:
  dense: intfloat/multilingual-e5-small
  reranker: null
  reader: null
