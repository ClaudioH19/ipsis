<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,interactive-widget=resizes-content">
<meta name="robots" content="noindex,nofollow">
<title>{{title}} · ipsis</title>
<style>
*{box-sizing:border-box}
body{margin:0;--rw-fondo:#f7f8fa;--rw-superficie:#fff;--rw-texto:#17212f;--rw-texto-suave:#607085;--rw-borde:#dce2e9;--rw-acento:#2563eb;--rw-fuente:system-ui,sans-serif;background:var(--rw-fondo);color:var(--rw-texto);font:16px/1.6 var(--rw-fuente)}
main{max-width:1000px;margin:auto;padding:32px 24px}
nav{display:flex;align-items:center;justify-content:space-between;gap:16px}
nav strong{font-size:22px;letter-spacing:-.05em}a{color:var(--rw-acento);text-underline-offset:4px}
.intro{max-width:670px;margin:44px 0 28px}h1{font-size:clamp(28px,5vw,44px);line-height:1.15;letter-spacing:-.035em;margin:0 0 16px}.intro p,footer{color:var(--rw-texto-suave)}
ipsis-chat{display:block;width:100%;height:100%;min-width:0}#buscador{height:max(480px,calc(100vh - 310px));height:max(480px,calc(100dvh - 310px))}.ayuda{margin:24px 0}summary{cursor:pointer}label{display:block;margin:12px 0 4px}input,button{font:inherit;padding:8px 12px;border:1px solid var(--rw-borde);border-radius:8px}input{background:var(--rw-superficie);color:inherit;max-width:100%;width:320px}button{background:var(--rw-acento);color:#fff;cursor:pointer}footer{font-size:13px;margin:24px 0}
@media(prefers-color-scheme:dark){body{--rw-fondo:#101820;--rw-superficie:#192430;--rw-texto:#ecf1f7;--rw-texto-suave:#acb9c8;--rw-borde:#354657;--rw-acento:#8bb9ff}}
@media(max-width:480px){main{max-width:none;padding:0}nav,.intro,footer{display:none}
#buscador{height:100vh;height:100dvh;min-height:0}.ayuda{display:none;margin:0;padding:12px}.ayuda:target{display:block}}
</style>
<link rel="stylesheet" href="/styles.css">
</head>
<body class="rw-raiz">
<main>
  <nav aria-label="{{navigation}}"><strong>ipsis<span aria-hidden="true">.</span></strong>[[ADMIN_LINK]]</nav>
  <section class="intro"><h1>{{title}}</h1><p>{{intro}}</p></section>
  <div id="buscador"><ipsis-chat mode="embedded" size="wide"></ipsis-chat></div>
  <details class="ayuda" id="clave-acceso"><summary>{{key_title}}</summary><form id="clave-form">
    <label for="clave">{{key_label}}</label><input id="clave" type="password" autocomplete="off">
    <button type="submit">{{key_apply}}</button>
  </form></details>
  <footer>{{footer}}</footer>
</main>
<script>
var clave=sessionStorage.getItem('ipsis-demo-key') || '';
if(clave)document.querySelector('ipsis-chat').setAttribute('widget-key',clave);
document.getElementById('clave').value=clave;
document.getElementById('clave-form').addEventListener('submit',function(e){
  e.preventDefault();var valor=document.getElementById('clave').value;
  if(valor)sessionStorage.setItem('ipsis-demo-key',valor);else sessionStorage.removeItem('ipsis-demo-key');
  window.location.reload();
});
</script>
<script src="/widget.js"></script>
</body>
</html>
