# Textos globales del asistente. Se copian a cada proyecto con `rag init`.
conectores:
  apertura:
    - "Esto es lo que dice el documento:"
    - "Encontré esto en el documento:"
    - "El documento lo plantea así:"
    - "Según el texto cargado:"
  complemento:
    - "A esto se suma lo siguiente:"
    - "El documento agrega, en otra sección:"
    - "También dice esto:"
    - "Y lo complementa así:"
  condicion:
    - "Esto aplica bajo una condición:"
    - "Hay una condición asociada:"
    - "El documento la condiciona así:"
  excepcion:
    - "Con una excepción:"
    - "Hay una salvedad:"
    - "El documento contempla una excepción:"
  secuencia: ["Primero", "Luego", "Por último"]
  contraste_version: ["En la versión {v1}…; en la {v2}…"]

abstencion:
  generico: "No encontré esa información en los documentos disponibles."
  premisa_no_encontrada: "No encontré información sobre \"{entidad}\" en los documentos disponibles. Puede que no exista o que esté fuera de lo que cubren tus documentos."
  zona_gris_intro: "No encontré una respuesta directa. Esto es lo que dicen los documentos sobre el tema:"

conversacional:
  categorias: [saludo, agradecimiento, despedida, capacidad]
  patrones:
    saludo: ["^\\s*hola\\b", "^\\s*buenos? d[ií]as\\b", "^\\s*buenas tardes\\b", "^\\s*buenas noches\\b", "^\\s*qu[eé] tal\\b", "^\\s*hey\\b", "^\\s*buenas\\b"]
    agradecimiento: ["\\bgracias\\b"]
    despedida: ["^\\s*chao\\b", "^\\s*adi[oó]s\\b", "^\\s*nos vemos\\b", "^\\s*hasta luego\\b", "^\\s*bye\\b"]
    capacidad: ["qu[eé] puedes hacer", "qui[eé]n eres", "para qu[eé] sirves", "c[oó]mo funcionas", "qu[eé] eres t[uú]"]
  respuestas:
    saludo:
      - "¡Hola! Soy {nombre_asistente}. Respondo preguntas sobre {descripcion_dominio} citando el texto exacto del documento. ¿Qué necesitas saber?"
      - "¡Hola! Pregúntame lo que necesites sobre {descripcion_dominio}: busco la respuesta en el documento y te muestro de dónde la saqué."
    agradecimiento:
      - "De nada. Si tienes otra pregunta sobre {descripcion_dominio}, aquí estoy."
      - "Con gusto. Cualquier otra duda sobre {descripcion_dominio}, dime."
    despedida: ["Hasta luego.", "Nos vemos. Vuelve cuando necesites consultar el documento."]
    capacidad:
      - "Soy {nombre_asistente}. Respondo preguntas sobre {descripcion_dominio} citando el texto exacto del documento. Si la información no está, te lo digo en vez de inventar una respuesta."
      - "Busco en {descripcion_dominio} y te devuelvo texto literal con su fuente."
