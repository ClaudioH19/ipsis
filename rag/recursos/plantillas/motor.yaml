# Configuración global inicial. Los umbrales de abstención son valores de
# partida sin calibrar; ajústalos con preguntas representativas de tu corpus.
config_version: 4
recuperacion:
  # modelo: lo define el perfil (asistente.yaml::perfil); descomenta para fijarlo.
  estrategia_chunking: "CH-F256"
  con_header: false
  modo: "hibrida"
  top_k: 3
  coleccion_base: "{coleccion_base}"
  qdrant_path: ".rag/indice/qdrant"
  version_coleccion: 1

componentes:
  parser: "builtin"
  chunker: "builtin"
  dense_encoder: "onnx"
  sparse_encoder: "bm25"
  retriever: "qdrant"
  fusion: "rrf"
  reranker: null
  intent_classifier: "rules"
  answer_extractor: "sentence_selector"
  evidence_verifier: "literal_offsets"
  response_renderer: "templates"
  abstention_policy: "cascada_v1"

qdrant:
  modo: "local"
  url_servidor: "http://localhost:6333"

servicio:
  concurrencia_maxima: 4

seguridad:
  limite_peticiones:
    capacidad: 100
    tasa_por_segundo: 1.0

redaccion:
  longitud_maxima_fragmento_chars: 500
  max_fragmentos_en_respuesta: 2
  score_relativo_minimo: 0.6
  cita_en_texto: "breve"
  incluir_apertura: true

abstencion:
  version: "plantilla_sin_calibrar"
  capa_a_fuera_dominio:
    senal: "score_top1_denso"
    umbral: 0.80
    grounding_lexico:
      oov_max: 0.5
  confianza_alta:
    senal: "score_top1_denso"
    umbral: 0.85
  capa_b_premisa:
    activa: true
    recuperacion_dirigida: true
    max_fragmentos_adicionales: 2
    tipos_entidad_cerrada: [decimal, porcentaje, plazo, fecha, articulo]
  zona_gris:
    modo: "relacionado"
criterios_aceptacion:
  E2_embeddings_chunking_recuperacion:
    recall_at_3_min: 0.85

pipeline_version: "ingesta-0.1.0"
