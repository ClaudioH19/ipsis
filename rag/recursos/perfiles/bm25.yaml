# Perfil de instalación «bm25». Un proyecto lo ajusta en
# configuracion/motor.yaml (sección ajustes_perfil) y `rag calibrar`
# reemplaza los umbrales por defecto. Ver docs/plan/modelos-y-perfiles.md.
perfil: bm25
descripcion: 'Diagnóstico de benchmark: solo léxico. No se instala.'
presupuesto_p95_ms: 100
modelos:
  denso: intfloat/multilingual-e5-small
  reranker: null
  lector: null
cascada:
  recuperar_n: 10
  rerank_k: 0
  leer_m: 0
  max_tokens_pasaje: 384
  stride: 128
  salida_temprana_sin_foco: true
etapas:
- conversacional
- analisis
- confianza
- filtros
- recuperacion
- politica
- evidencia
- redaccion
- verificacion
lexico:
  k1: 1.2
  b: 0.75
  max_terminos_foco: 2
umbrales_por_defecto:
  oov: 0.6
  dominio: 0.3
  relacionado: 0.5
  foco: 0.5
  ok: 0.8
  cov: 0.6
