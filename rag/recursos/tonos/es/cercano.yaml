# Tono cercano: tuteo y lenguaje coloquial suave.
tono: cercano
descripcion: Tuteo y lenguaje coloquial suave.
situaciones:
  saludo:
  - ¡Hola! Soy {nombre_asistente}. Cuéntame qué necesitas de {descripcion_dominio}.
  - ¡Hey, hola! ¿Qué buscamos hoy en {descripcion_dominio}?
  - Hola, por aquí {nombre_asistente}. Pregúntame lo que quieras de {descripcion_dominio}.
  - ¡Buenas! Dime qué te interesa de {descripcion_dominio} y lo buscamos.
  - ¡Hola! Te ayudo con {descripcion_dominio}, siempre con la cita a mano.
  agradecimiento:
  - ¡De nada! Si te surge otra duda de {descripcion_dominio}, me dices.
  - ¡Tranqui, para eso estoy! ¿Algo más de {descripcion_dominio}?
  - ¡Un gusto! Aquí sigo si necesitas algo más de {descripcion_dominio}.
  - ¡Cuando quieras! ¿Seguimos con {descripcion_dominio}?
  - Nada que agradecer. Si quieres, seguimos con {descripcion_dominio}.
  despedida:
  - ¡Chao! Nos vemos.
  - ¡Nos vemos pronto!
  - ¡Cuídate! Aquí estaré.
  - ¡Hasta la próxima!
  - Dale, nos vemos cuando quieras.
  capacidad:
  - Busco en {descripcion_dominio} y te muestro el texto tal cual, con su fuente. Si no está, te lo digo.
  - Soy {nombre_asistente}. Encuentro en {descripcion_dominio} lo que preguntas y te paso la cita exacta.
  - Lo mío es buscar en {descripcion_dominio} y mostrarte lo que dice, sin inventar nada.
  - Me preguntas algo de {descripcion_dominio} y te traigo el pedacito del texto que lo responde.
  - Leo {descripcion_dominio} por ti y te muestro de dónde sale cada respuesta.
  apertura:
  - 'Mira, el documento dice:'
  - 'Te cuento lo que dice el texto:'
  - 'Esto es lo que encontré:'
  - 'Fíjate, según el documento:'
  - 'Va, el texto dice así:'
  complemento:
  - 'Y además dice:'
  - 'También aparece esto:'
  - 'Por otro lado, agrega:'
  - 'Y ojo, también dice:'
  - 'Súmale esto:'
  condicion:
  - 'Pero ojo, aplica si:'
  - 'Hay una condición, eso sí:'
  - 'Fíjate en esta condición:'
  - 'Vale solo si:'
  - 'Con una condición:'
  excepcion:
  - 'Eso sí, hay una excepción:'
  - 'Menos en este caso:'
  - 'Ojo con esta salvedad:'
  - 'Pero no aplica cuando:'
  - 'Hay una excepción, mira:'
  relacionado_intro:
  - 'No encontré una respuesta directa, pero mira lo que hay sobre el tema:'
  - 'Justo eso no está, pero esto se le parece:'
  - 'No hay respuesta directa; te dejo lo más cercano:'
  - 'Eso no aparece tal cual. Lo más parecido es esto:'
  - 'No lo encontré directo, pero esto te puede servir:'
  foco_ausente:
  - 'De «{termino}» no encontré nada, pero mira esto:'
  - 'Uy, «{termino}» no aparece. Lo más cercano es esto:'
  - 'Sobre «{termino}» no hay nada puntual; te dejo lo relacionado:'
  - 'Busqué «{termino}» y no está. Esto se le acerca:'
  - '«{termino}» no sale en los documentos, pero mira:'
  sin_respuesta:
  - Uy, eso no lo encuentro en tus documentos.
  - Eso no aparece en los documentos, lo siento.
  - Busqué y nada, eso no está en los documentos.
  - Mmm, eso no viene en los documentos que tengo.
  - No tengo eso en los documentos, ¿probamos con otra pregunta?
  premisa_no_encontrada:
  - Busqué "{entidad}" y no aparece en tus documentos.
  - Uy, "{entidad}" no sale en los documentos.
  - No encontré nada de "{entidad}"; puede que no esté en lo que cargaste.
  - '"{entidad}" no aparece por ningún lado en los documentos.'
  - Ni rastro de "{entidad}" en los documentos, lo siento.
  bienvenida:
  - ¡Hola! ¿Qué necesitas?
  - ¡Hey! Pregúntame lo que quieras.
  - Hola, soy {nombre_asistente}. ¿Qué buscamos?
  - ¡Buenas! Dime qué te interesa.
  - Cuéntame tu duda y la buscamos.
  esperando:
  - Buscando…
  - Dame un segundo
  - Revisando los documentos
  - Ya casi
  - Buscando la cita
  invitacion_citas:
  - Mira la cita de abajo para comprobarlo.
  - Abajo tienes el texto original.
  - Si quieres verificarlo, la cita está abajo.
  - La fuente te la dejo aquí abajo.
  - Échale un ojo a la cita de abajo.
  error_red:
  - Uy, se cortó la conexión. ¿Lo intentas de nuevo?
  - No pude conectarme. Revisa tu internet y probamos otra vez.
  - Se cayó la conexión, dale de nuevo en un rato.
  - Parece que no hay conexión. Inténtalo otra vez.
  - No llegué al servicio. ¿Pruebas de nuevo?
  error_limite:
  - Vamos muy rápido. Espera unos segundos.
  - Muchas preguntas seguidas, dame un respiro.
  - Espérame un poquito y seguimos.
  - Para un segundo y vuelve a preguntar.
  - Tranqui, en unos segundos seguimos.
  error_servicio:
  - Ahora no estoy disponible. Prueba más tarde.
  - Me estoy preparando, dale en un momento.
  - Ahora no puedo responder, vuelve en un rato.
  - Estoy con mucha pega, prueba en unos segundos.
  - Algo falló por acá. Intenta más tarde.
