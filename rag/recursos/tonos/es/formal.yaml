# Tono formal: trato de usted, sin exclamaciones, registro cuidado.
tono: formal
descripcion: Trato de usted y registro cuidado, sin exclamaciones.
situaciones:
  saludo:
  - Buenos días. Le saluda {nombre_asistente}. Respondo consultas sobre {descripcion_dominio} citando textualmente el documento. ¿En qué puedo asistirle?
  - Bienvenido. Puede consultarme sobre {descripcion_dominio}; le indicaré siempre la fuente exacta de cada respuesta.
  - Saludos. Soy {nombre_asistente} y estoy a su disposición para consultas sobre {descripcion_dominio}.
  - Le saluda {nombre_asistente}. Indíqueme qué desea consultar sobre {descripcion_dominio}.
  - Es un gusto atenderle. Formule su consulta sobre {descripcion_dominio} y le mostraré el texto correspondiente.
  agradecimiento:
  - No hay de qué. Quedo a su disposición para otras consultas sobre {descripcion_dominio}.
  - Ha sido un placer atenderle. Puede volver a consultar sobre {descripcion_dominio} cuando lo estime.
  - A usted. Si requiere revisar otro aspecto de {descripcion_dominio}, no dude en indicarlo.
  - Con mucho gusto. Sigo disponible para cualquier consulta sobre {descripcion_dominio}.
  - Agradezco su consulta. Estoy a su servicio para lo relacionado con {descripcion_dominio}.
  despedida:
  - Que tenga un buen día.
  - Hasta pronto. Quedo a su disposición.
  - Ha sido un gusto atenderle. Hasta luego.
  - Le deseo una buena jornada. Puede volver cuando lo necesite.
  - Hasta la próxima consulta.
  capacidad:
  - Soy {nombre_asistente}. Respondo consultas sobre {descripcion_dominio} citando textualmente el documento; si la información no figura, se lo indico.
  - Localizo en {descripcion_dominio} el pasaje pertinente y se lo presento de forma literal, con su referencia.
  - 'Mi función es la siguiente: buscar en {descripcion_dominio} y mostrarle el texto exacto que responde su consulta.'
  - No redacto contenido propio. Le presento lo que dice {descripcion_dominio}, con la cita correspondiente.
  - Puede consultarme sobre {descripcion_dominio}; cada respuesta incluye el texto original y su ubicación.
  apertura:
  - 'El documento establece lo siguiente:'
  - 'Conforme al documento:'
  - 'De acuerdo con el texto disponible:'
  - 'El documento indica lo siguiente:'
  - 'Según consta en el documento:'
  complemento:
  - 'Adicionalmente, el documento señala:'
  - 'Asimismo, se indica lo siguiente:'
  - 'En otra sección se agrega:'
  - 'El documento añade lo siguiente:'
  - 'Cabe agregar lo siguiente:'
  condicion:
  - 'Lo anterior se sujeta a la siguiente condición:'
  - 'Rige la siguiente condición:'
  - 'El documento lo condiciona de esta forma:'
  - 'Tenga presente la siguiente condición:'
  - 'Para su aplicación, el documento establece:'
  excepcion:
  - 'Se contempla la siguiente excepción:'
  - 'Con la siguiente salvedad:'
  - 'El documento exceptúa lo siguiente:'
  - 'Tenga presente esta excepción:'
  - 'No aplica en el caso siguiente:'
  relacionado_intro:
  - 'No se encontró una respuesta directa. Le presento lo que los documentos señalan sobre el tema:'
  - 'Los documentos no contienen una respuesta directa; esto es lo más relacionado:'
  - 'No figura una respuesta directa a su consulta. Le muestro el contenido más próximo:'
  - 'No es posible ofrecerle una respuesta directa. Los documentos indican lo siguiente sobre el tema:'
  - 'Su consulta no tiene respuesta directa en los documentos. Esto es lo relacionado:'
  foco_ausente:
  - 'No se encontró información específica sobre «{termino}». Le presento lo más cercano:'
  - 'Los documentos no tratan específicamente «{termino}». Esto es lo más próximo:'
  - 'No consta información puntual sobre «{termino}»; le muestro lo relacionado:'
  - 'No se encontró «{termino}» en los documentos. Esto es lo más cercano:'
  - 'Respecto de «{termino}» no hay una respuesta directa. Le presento lo relacionado:'
  sin_respuesta:
  - Lamentablemente, esa información no figura en los documentos disponibles.
  - No se encontró esa información en los documentos disponibles.
  - Los documentos disponibles no contienen información sobre su consulta.
  - Lamento informarle que esa información no consta en los documentos.
  - 'Tras revisar los documentos, no es posible responder su consulta: la información no figura.'
  premisa_no_encontrada:
  - No se encontró información sobre "{entidad}" en los documentos disponibles. Es posible que no exista o que exceda su alcance.
  - Los documentos no hacen referencia a "{entidad}".
  - No consta información sobre "{entidad}" en los documentos disponibles.
  - Lamento informarle que "{entidad}" no figura en los documentos.
  - Tras revisar los documentos, no se encontró referencia a "{entidad}".
  bienvenida:
  - Buenos días. ¿En qué puedo asistirle?
  - Bienvenido. Formule su consulta, por favor.
  - Le saluda {nombre_asistente}. ¿Qué desea consultar?
  - Estoy a su disposición. Cada respuesta incluye su fuente.
  - Indíqueme su consulta y le mostraré el texto correspondiente.
  esperando:
  - Consultando el documento
  - Revisando la documentación
  - Localizando la referencia exacta
  - Un momento, por favor
  - Buscando el pasaje pertinente
  invitacion_citas:
  - Puede verificarlo en la cita que se presenta a continuación.
  - El texto original figura abajo para su verificación.
  - Consulte la referencia inferior para comprobar su origen.
  - La fuente exacta se indica a continuación.
  - Le invito a verificarlo en la cita inferior.
  error_red:
  - No fue posible establecer conexión con el asistente. Verifique su conexión e inténtelo nuevamente.
  - Se produjo un problema de conexión. Le ruego intentarlo de nuevo en unos momentos.
  - No se pudo contactar al servicio. Verifique su conexión, por favor.
  - La conexión con el asistente se interrumpió. Inténtelo nuevamente.
  - No fue posible comunicarse con el servicio. Le ruego reintentar más tarde.
  error_limite:
  - Se ha alcanzado el límite de consultas seguidas. Le ruego esperar unos segundos.
  - Por favor, aguarde unos segundos antes de su próxima consulta.
  - Ha realizado varias consultas en poco tiempo. Inténtelo nuevamente en breve.
  - Le ruego esperar un momento antes de continuar.
  - Es necesario esperar unos segundos para atender su siguiente consulta.
  error_servicio:
  - El servicio no se encuentra disponible en este momento. Le ruego intentarlo más tarde.
  - El asistente se está iniciando. Inténtelo nuevamente en unos momentos.
  - En este momento no es posible atender su consulta. Inténtelo más tarde.
  - El servicio está ocupado. Le ruego reintentar en unos segundos.
  - Se produjo un inconveniente en el servicio. Le ruego intentarlo nuevamente más tarde.
