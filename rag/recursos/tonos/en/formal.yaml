  - Please wait a few seconds before your next enquiry.
  - Several enquiries were made in a short time. Please try again shortly.
  - Kindly wait a moment before continuing.
  - A few seconds are required before your next enquiry can be handled.
  error_servicio:
  - The service is not available at the moment. Kindly try again later.
  - The assistant is starting up. Please try again in a few moments.
  - Your enquiry cannot be handled at this time. Please try again later.
  - The service is busy. Kindly try again in a few seconds.
  - A problem occurred in the service. Kindly try again later.
