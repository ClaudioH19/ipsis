  - Hello! {nombre_asistente} here. Tell me what you are looking for in {descripcion_dominio} and I will show you what the text says.
  - Hi, I'm {nombre_asistente}. What would you like to check in {descripcion_dominio}?
  - Nice to see you! Ask me anything about {descripcion_dominio} and I will show you the exact quote.
  agradecimiento:
