# Cordial tone (default): kind and clear. The first variant of each situation
# is the text used before tones existed.
tono: cordial
descripcion: Kind and clear; the default tone.
situaciones:
  saludo:
  - Hi! I'm {nombre_asistente}. I answer questions about {descripcion_dominio} quoting the exact text of the document. What do you need to know?
