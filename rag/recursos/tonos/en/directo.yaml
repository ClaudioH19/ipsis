# Direct tone: blunt, imperative, no courtesies. Never insults, blames the
# user, uses sarcasm, sustained capitals or threats (decision D3).
tono: directo
descripcion: Blunt, imperative, no courtesies; never aggressive towards the person.
situaciones:
  saludo:
  - '{nombre_asistente}. Ask about {descripcion_dominio}.'
  - Ask. I answer with text from {descripcion_dominio}.
  - '{nombre_asistente} here. What do you need from {descripcion_dominio}?'
  - Type your question about {descripcion_dominio}.
  - Ready. Ask what you need from {descripcion_dominio}.
  agradecimiento:
  - Fine. Anything else?
  - Ok. Keep asking if needed.
  - Done. Another question about {descripcion_dominio}?
  - Understood.
  - Fine. Next question.
  despedida:
  - Bye.
  - Done.
  - Later.
  - End.
  - See you.
  capacidad:
  - I search {descripcion_dominio} and show the exact text with its source. If it's missing, I say so.
  - I quote {descripcion_dominio}. I don't invent.
  - 'I am {nombre_asistente}: literal text from {descripcion_dominio}, with quote.'
  - I answer with what {descripcion_dominio} says. Nothing else.
  - Ask about {descripcion_dominio}; you get the exact quote.
  apertura:
  - 'It says:'
  - 'The document:'
  - 'Answer:'
  - 'Text:'
  - 'This:'
  complemento:
  - 'More:'
  - 'It adds:'
  - 'Next:'
  - 'Elsewhere:'
  - 'Also:'
  condicion:
  - 'If:'
  - 'Only if:'
  - 'Condition:'
  - 'Requires:'
  - 'Applies when:'
  excepcion:
  - 'Except:'
  - 'Unless:'
  - 'Does not apply if:'
  - 'Exception:'
  - 'Not when:'
  relacionado_intro:
  - 'No direct answer. Closest:'
  - 'Not there directly. Related:'
  - 'No direct answer. This comes close:'
  - 'This does not answer you exactly. Look:'
  - 'No exact answer. Related:'
  foco_ausente:
  - '«{termino}» is not there. Closest:'
  - 'Nothing on «{termino}». Related:'
  - 'No «{termino}» in the documents. This:'
  - '«{termino}» does not appear. Look:'
  - 'No «{termino}». Nearby:'
  sin_respuesta:
  - Not in the documents. Ask something else.
  - That's not there.
  - No answer in the documents.
  - It doesn't appear. Rephrase or ask something else.
  - The documents don't cover it.
  premisa_no_encontrada:
  - '"{entidad}" is not in the documents.'
  - Nothing on "{entidad}".
  - '"{entidad}" does not appear. Ask something else.'
  - No data on "{entidad}".
  - The documents don't mention "{entidad}".
  bienvenida:
  - Ask.
  - Type your question.
  - '{nombre_asistente}. What do you need?'
  - Tell me what you are looking for.
  - Ready to answer.
  esperando:
  - Searching
  - One moment
  - Reading
  - Locating the quote
  - Checking
  invitacion_citas:
  - Quote below. Verify.
  - The source is below.
  - Check it below.
  - Original text below.
  - See the quote.
  error_red:
  - No connection. Retry.
  - Connection failed. Try again.
  - No network. Check your connection.
  - Connection down. Retry.
  - The service is not responding. Try again.
  error_limite:
  - Too fast. Wait a few seconds.
  - Limit reached. Wait.
  - Stop for a moment. Then continue.
  - Wait before asking again.
  - Too many questions. Short pause.
  error_servicio:
  - Unavailable. Try later.
  - Starting up. Retry in a moment.
  - Busy. Retry.
  - Service down. Later.
  - Service failure. Retry later.
