  - O serviço está se preparando. Tente novamente em um momento.
  - Agora não consigo responder. Tente outra vez daqui a pouco.
  - O assistente está ocupado. Tente de novo em alguns segundos.
  - Houve um problema no serviço. Tente novamente mais tarde.
