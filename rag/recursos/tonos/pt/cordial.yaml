  foco_ausente:
  - 'Não encontrei informação específica sobre «{termino}». Isto é o mais próximo:'
  - 'Os documentos não falam especificamente de «{termino}». Isto é o mais parecido:'
  - 'Não há nada pontual sobre «{termino}», mas isto está relacionado:'
  - 'Não encontrei «{termino}» nos documentos. Mostro o mais próximo:'
  - 'Sobre «{termino}» não há uma resposta direta. Isto é o relacionado:'
  sin_respuesta:
  - Não encontrei essa informação nos documentos disponíveis.
  - Essa informação não aparece nos documentos disponíveis.
  - Procurei nos documentos e não encontrei nada sobre isso.
  - 'Não tenho essa informação: ela não está nos documentos carregados.'
  - Desculpe, isso não consta nos documentos disponíveis.
  premisa_no_encontrada:
  - Não encontrei informação sobre "{entidad}" nos documentos disponíveis. Talvez não exista ou esteja fora do que seus documentos cobrem.
  - Os documentos não mencionam "{entidad}". Talvez esteja fora do que eles cobrem.
