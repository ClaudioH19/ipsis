# Tom cordial (padrão): gentil e claro. A primeira variante de cada situação
# é o texto anterior aos tons.
tono: cordial
descripcion: Gentil e claro; o tom padrão.
situaciones:
  saludo:
  - Olá! Sou {nombre_asistente}. Respondo perguntas sobre {descripcion_dominio} citando o texto exato do documento. O que você precisa saber?
  - 'Olá! Pergunte o que precisar sobre {descripcion_dominio}: busco a resposta no documento e mostro de onde a tirei.'
  - Olá! Aqui é {nombre_asistente}. Conte o que você procura em {descripcion_dominio} e eu mostro o que diz o texto.
  - Oi, sou {nombre_asistente}. O que você gostaria de consultar sobre {descripcion_dominio}?
  - Que bom te ver! Pergunte o que quiser sobre {descripcion_dominio} e eu mostro a citação exata.
  agradecimiento:
  - De nada. Se tiver outra pergunta sobre {descripcion_dominio}, estou aqui.
  - Com prazer. Qualquer outra dúvida sobre {descripcion_dominio}, é só dizer.
  - Foi um prazer! Se quiser revisar mais alguma coisa de {descripcion_dominio}, pergunte.
  - Não há de quê. Continuo aqui para o que precisar sobre {descripcion_dominio}.
  - Que bom que ajudou. Mais alguma coisa sobre {descripcion_dominio}?
  despedida:
  - Até logo.
  - Até mais. Volte quando precisar consultar o documento.
  - Tudo de bom! Estarei aqui quando precisar revisar os documentos.
  - Até breve. Quando quiser, seguimos consultando.
  - Tchau, e obrigado por perguntar.
  capacidad:
  - Sou {nombre_asistente}. Respondo perguntas sobre {descripcion_dominio} citando o texto exato do documento. Se a informação não estiver lá, eu digo em vez de inventar uma resposta.
  - Busco em {descripcion_dominio} e devolvo texto literal com a fonte.
  - 'Sou {nombre_asistente}: encontro em {descripcion_dominio} o trecho que responde sua pergunta e mostro como está, com a citação.'
  - Respondo só com o que diz {descripcion_dominio}, citado ao pé da letra. Se algo não estiver lá, eu digo.
  - 'Pergunte sobre {descripcion_dominio}: mostro o texto exato e onde aparece, sem inventar nada.'
  apertura:
  - 'Isto é o que diz o documento:'
  - 'Encontrei isto no documento:'
  - 'O documento coloca assim:'
  - 'Segundo o texto carregado:'
  - 'Aqui está o que encontrei:'
  complemento:
  - 'Soma-se a isto o seguinte:'
  - 'O documento acrescenta, em outra seção:'
  - 'Também diz isto:'
  - 'E complementa assim:'
  - 'Além disso, encontrei isto:'
  condicion:
  - 'Isto se aplica sob uma condição:'
  - 'Há uma condição associada:'
  - 'O documento condiciona assim:'
  - 'Leve em conta esta condição:'
  - 'Para que se aplique, o documento indica:'
  excepcion:
  - 'Com uma exceção:'
  - 'Há uma ressalva:'
  - 'O documento prevê uma exceção:'
  - 'Atenção a esta exceção:'
  - 'Não se aplica no seguinte caso:'
  relacionado_intro:
  - 'Não encontrei uma resposta direta. Isto é o que os documentos dizem sobre o tema:'
  - 'Não há uma resposta direta nos documentos, mas isto é o mais relacionado:'
