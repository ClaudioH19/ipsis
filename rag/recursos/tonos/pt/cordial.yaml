  - Olá! Pergunte o que precisar sobre os documentos.
  - Olá, sou {nombre_asistente}. O que você quer consultar?
  - O que você gostaria de saber? Respondo citando o documento.
  - Olá! Escreva sua pergunta e eu busco a resposta no texto.
  esperando:
  - Buscando no documento
  - Revisando os documentos
  - Buscando a citação exata
  - Um momento, estou lendo
  - Buscando a resposta no texto
  invitacion_citas:
  - Você pode conferir na citação abaixo.
  - O texto original está abaixo para você verificar.
  - Veja a citação abaixo para saber de onde vem.
  - A fonte exata está logo abaixo.
  - Confira você mesmo na citação abaixo.
  error_red:
  - Não foi possível contatar o assistente. Verifique sua conexão e tente de novo.
  - Parece que não há conexão com o assistente. Tente novamente em um momento.
  - Não consegui me conectar. Verifique sua conexão e tente de novo.
  - A conexão com o assistente caiu. Tente novamente.
  - Não consegui falar com o serviço. Tente outra vez em alguns segundos.
