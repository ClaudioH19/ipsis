  - Estamos indo um pouco rápido. Espere alguns segundos antes da próxima pergunta.
  - Recebi muitas perguntas juntas. Me dê alguns segundos e tente de novo.
  - Preciso de uma pausa breve. Tente de novo em alguns segundos.
  - Espere um momento antes de perguntar outra vez.
  error_servicio:
